iceberg_as_code:
  target: dev
  outputs:
    # TimeZone UTC on every target: the fact models cast AEMO's wall-clock strings to
    # TIMESTAMPTZ, so the instant they store depends on the session's zone. The runners are
    # UTC already; this keeps a run from a machine that isn't from writing other values.
    ci:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', ':memory:') }}"
      threads: 1
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      settings:
        TimeZone: UTC
        # Under the runner's 16 GB with room for the rest of the process, and somewhere to
        # spill: an in-memory database has no temp directory of its own. Without them the
        # full-table tests over fct_scada (half a billion rows, GROUP BY) had the runner
        # killed instead of spilling, every night from 2026-10-21 (DuckDB 2.0).
        memory_limit: 10GB
        temp_directory: /tmp/duckdb_spill
      extensions:
        - parquet
        - httpfs
        - json

    # dev and prod both attach the OneLake Iceberg REST catalog. Environment contract
    # (set by the workflows; locally: az login + mint a storage token yourself):
    #   WAREHOUSE_PATH   -> "{workspace_id}/{lakehouse_id}"
    #   ONELAKE_ENDPOINT -> https://onelake.table.fabric.microsoft.com/iceberg
    #   ONELAKE_TOKEN    -> az account get-access-token --resource https://storage.azure.com/
    # access_delegation_mode 'none' means the catalog vends no storage credentials — the
    # azure secret below is what authorises the actual data-file reads/writes.
    # Use int 0/1 for the attach options, not bools: dbt-duckdb silently drops
    # boolean-false attach options.
    dev:
      type: duckdb
      path: ':memory:'
      threads: 1
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      settings:
        TimeZone: UTC
        # Under the runner's 16 GB with room for the rest of the process, and somewhere to
        # spill: an in-memory database has no temp directory of its own. Without them the
        # full-table tests over fct_scada (half a billion rows, GROUP BY) had the runner
        # killed instead of spilling, every night from 2026-10-21 (DuckDB 2.0).
        memory_limit: 10GB
        temp_directory: /tmp/duckdb_spill
      extensions:
        - parquet
        - httpfs
        - json
        - iceberg
      secrets:
        - type: azure
          name: onelake_storage
          provider: access_token
          access_token: "{{ env_var('ONELAKE_TOKEN') }}"
      attach:
        - path: "{{ env_var('WAREHOUSE_PATH') }}"
          alias: iceberg_catalog
          type: iceberg
          options:
            endpoint: "{{ env_var('ONELAKE_ENDPOINT') }}"
            token: "{{ env_var('ONELAKE_TOKEN') }}"
            access_delegation_mode: 'none'
            stage_create_tables: 0
            skip_create_table_metadata_updates: 1
            default_schema: dbo
      database: iceberg_catalog

    prod:
      type: duckdb
      path: ':memory:'
      threads: 1
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      settings:
        TimeZone: UTC
        # Under the runner's 16 GB with room for the rest of the process, and somewhere to
        # spill: an in-memory database has no temp directory of its own. Without them the
        # full-table tests over fct_scada (half a billion rows, GROUP BY) had the runner
        # killed instead of spilling, every night from 2026-10-21 (DuckDB 2.0).
        memory_limit: 10GB
        temp_directory: /tmp/duckdb_spill
      extensions:
        - parquet
        - httpfs
        - json
        - iceberg
      secrets:
        - type: azure
          name: onelake_storage
          provider: access_token
          access_token: "{{ env_var('ONELAKE_TOKEN') }}"
      attach:
        - path: "{{ env_var('WAREHOUSE_PATH') }}"
          alias: iceberg_catalog
          type: iceberg
          options:
            endpoint: "{{ env_var('ONELAKE_ENDPOINT') }}"
            token: "{{ env_var('ONELAKE_TOKEN') }}"
            access_delegation_mode: 'none'
            stage_create_tables: 0
            skip_create_table_metadata_updates: 1
            default_schema: dbo
      database: iceberg_catalog
