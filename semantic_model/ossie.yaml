# The semantic model, in Apache Ossie (https://github.com/apache/ossie, core-spec 0.2.0.dev0).
# Measures are metrics in the DAX dialect. What Ossie has no place for (a relationship's
# filter direction, a measure's table and format string, the Direct Lake partitions, ...) is in
# POWER_BI extensions, as the TMSL properties: scripts/ossie_to_bim.mjs writes Power BI's
# model.bim from this file (dax-sql/formats/ossie.js), and the page reads it the same way.
version: 0.2.0.dev0
name: nem
description: "Australia's National Electricity Market, over the Iceberg tables of the nem lakehouse, in Direct Lake: nothing is imported and no SQL endpoint is involved. Deployed by scripts/deploy_model.py, which writes the workspace and the lakehouse into the DirectLake expression. A quantity is one measure whatever the grain and whoever asks: the measures of fct_summary and fct_region pick the daily table or the 5-minute one themselves, by whether a time of day is asked for. Power BI and the dashboard's page (through its compiler) call the same measures."
datasets:
  - name: dim_calendar
    source: mart.dim_calendar
    primary_key:
      - date
    description: One row per day, from 2018-03-06 (where the history starts) to two years ahead.
    fields:
      - name: date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: date
        datatype: Date
        description: Calendar date, NEM time (AEST all year).
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"date","summarizeBy":"none","formatString":"yyyy-MM-dd"}'
      - name: year
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: year
        datatype: Integer
        description: Calendar year.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"year","summarizeBy":"none"}'
      - name: month
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: month
        datatype: Integer
        description: Month of the year, 1-12.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"month","summarizeBy":"none"}'
    custom_extensions:
      - vendor_name: POWER_BI
        data: '{"sourceLineageTag":"[mart].[dim_calendar]","partitions":[{"name":"dim_calendar","mode":"directLake","source":{"type":"entity","entityName":"dim_calendar","expressionSource":"DirectLake","schemaName":"mart"}}]}'
  - name: dim_duid
    source: mart.dim_duid
    primary_key:
      - DUID
    description: "One row per unit: the units on AEMO's registration list, the ones in the data that are not on it (retired plant, replaced DUIDs), and the WA facilities."
    fields:
      - name: DUID
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: DUID
        datatype: String
        description: AEMO's id of a dispatchable unit.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"DUID","summarizeBy":"none"}'
      - name: Region
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: Region
        datatype: String
        description: NSW1, QLD1, SA1, TAS1, VIC1; WA1 for Western Australia, another market.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"Region","summarizeBy":"none"}'
      - name: State
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: State
        datatype: String
        description: The region's name.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"State","summarizeBy":"none"}'
      - name: FuelSourceDescriptor
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: FuelSourceDescriptor
        datatype: String
        description: The fuel as registered; blank for the loads AEMO gives no energy source for.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"FuelSourceDescriptor","summarizeBy":"none"}'
      - name: Participant
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: Participant
        datatype: String
        description: The registered participant that operates the unit.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"Participant","summarizeBy":"none"}'
      - name: StationName
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: StationName
        datatype: String
        description: The power station the unit belongs to; blank for WA.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"StationName","summarizeBy":"none"}'
      - name: TechnologyType
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: TechnologyType
        datatype: String
        description: AEMO's technology descriptor; blank off the registration list.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"TechnologyType","summarizeBy":"none"}'
      - name: Classification
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: Classification
        datatype: String
        description: Scheduled, Semi-Scheduled (wind and solar farms that can be capped) or Non-Scheduled; blank off the registration list.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"Classification","summarizeBy":"none"}'
      - name: CO2eFactor
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: CO2eFactor
        datatype: Float
        description: "CO2-e emitted per MWh sent out, tonnes: AEMO's factor for the unit's gensets (MMSDM GENUNITS through DUALLOC), registered or not. Blank for loads, AEMO's dummy units, the gensets AEMO lists \"On Exclusion List\" and WA."
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"CO2eFactor","summarizeBy":"none","formatString":"0.000"}'
      - name: Renewable
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: Renewable
        datatype: Boolean
        description: Whether the unit's fuel is renewable; the list of fuels is in dim_duid.sql.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"Renewable","summarizeBy":"none"}'
      - name: RegCapMW
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: RegCapMW
        datatype: Float
        description: Registered generating capacity, MW.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"RegCapMW","summarizeBy":"none"}'
      - name: MaxCapMW
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: MaxCapMW
        datatype: Float
        description: Maximum generating capacity, MW.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"MaxCapMW","summarizeBy":"none"}'
      - name: StorageMWh
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: StorageMWh
        datatype: Float
        description: A battery's storage, MWh.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"StorageMWh","summarizeBy":"none"}'
      - name: latitude
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: latitude
        datatype: Float
        description: Latitude; blank when unknown.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"latitude","summarizeBy":"none"}'
      - name: longitude
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: longitude
        datatype: Float
        description: Longitude; blank when unknown.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"longitude","summarizeBy":"none"}'
      - name: Storage
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: Storage
        datatype: Boolean
        description: Whether the unit is storage, a battery (the fuel "Grid"). The rule is in dim_duid.sql; the measures that leave storage out filter on it.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"Storage","summarizeBy":"none"}'
      - name: Plant
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: Plant
        datatype: String
        description: "What units are grouped by when they are grouped by plant: the station, or the unit itself when it has none."
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"Plant","summarizeBy":"none"}'
      - name: Owner
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: Owner
        datatype: String
        description: "Who the output is counted to: the participant, or for rooftop solar the estimate it is. Blank where AEMO names no participant."
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"Owner","summarizeBy":"none"}'
    custom_extensions:
      - vendor_name: POWER_BI
        data: '{"sourceLineageTag":"[mart].[dim_duid]","partitions":[{"name":"dim_duid","mode":"directLake","source":{"type":"entity","entityName":"dim_duid","expressionSource":"DirectLake","schemaName":"mart"}}]}'
  - name: fct_summary
    source: mart.fct_summary
    description: "Output and price per unit and 5 minutes: the daily files where they have landed, the intraday feed after them. A unit's row carries the price of its region, so no measure joins two facts. An interval at 0 MW is not stored."
    fields:
      - name: date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: date
        datatype: Date
        description: Date of the dispatch interval, NEM time (AEST all year).
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"date","summarizeBy":"none","formatString":"yyyy-MM-dd"}'
      - name: time
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: time
        datatype: Integer
        description: "Time of day as HHMM: 1435 is 14:35. The interval ends at it."
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"time","summarizeBy":"none"}'
      - name: DUID
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: DUID
        datatype: String
        description: The unit.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"DUID","summarizeBy":"none"}'
      - name: mw
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: mw
        datatype: Decimal
        description: MW in that 5 minutes; a battery charging is negative.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"mw","summarizeBy":"none","formatString":"#,##0.00"}'
      - name: price
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: price
        datatype: Decimal
        description: The regional reference price of the unit's region in that interval, $/MWh.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"price","summarizeBy":"none","formatString":"$#,##0.00"}'
      - name: cutoff
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: cutoff
        datatype: DateTime
        description: The newest interval in the facts when the row was written. Provenance only.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"cutoff","summarizeBy":"none","formatString":"yyyy-MM-dd HH:mm"}'
    custom_extensions:
      - vendor_name: POWER_BI
        data: '{"sourceLineageTag":"[mart].[fct_summary]","partitions":[{"name":"fct_summary","mode":"directLake","source":{"type":"entity","entityName":"fct_summary","expressionSource":"DirectLake","schemaName":"mart"}}]}'
  - name: dim_region
    source: mart.dim_region
    primary_key:
      - Region
    description: "One row per region: what the units, the regional table and rooftop are all filtered by."
    fields:
      - name: Region
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: Region
        datatype: String
        description: NSW1, QLD1, SA1, TAS1, VIC1; WA1 is Western Australia, another market (units, no prices).
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"Region","summarizeBy":"none"}'
      - name: State
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: State
        datatype: String
        description: The region's name.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"State","summarizeBy":"none"}'
    custom_extensions:
      - vendor_name: POWER_BI
        data: '{"sourceLineageTag":"[mart].[dim_region]","partitions":[{"name":"dim_region","mode":"directLake","source":{"type":"entity","entityName":"dim_region","expressionSource":"DirectLake","schemaName":"mart"}}]}'
  - name: dim_time
    source: mart.dim_time
    primary_key:
      - time
    description: "The 5-minute times of a day, 288 rows: the time axis of every fact, and what a measure reads rooftop solar against between two half hours."
    fields:
      - name: time
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: time
        datatype: Integer
        description: "Time of day as HHMM: 1435 is 14:35. An interval ends at it."
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"time","summarizeBy":"none"}'
      - name: minute
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: minute
        datatype: Integer
        description: The same time as minutes since midnight, 0 to 1435.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"minute","summarizeBy":"none"}'
      - name: hour
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: hour
        datatype: Integer
        description: Hour of day, 0 to 23.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"hour","summarizeBy":"none"}'
    custom_extensions:
      - vendor_name: POWER_BI
        data: '{"sourceLineageTag":"[mart].[dim_time]","partitions":[{"name":"dim_time","mode":"directLake","source":{"type":"entity","entityName":"dim_time","expressionSource":"DirectLake","schemaName":"mart"}}]}'
  - name: fct_region
    source: mart.fct_region
    description: Price, demand and net interchange per region and 5 minutes, with the region's semi-scheduled wind and solar. The intraday record where it exists (2026-08 on), the next-day record before it.
    fields:
      - name: REGIONID
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: REGIONID
        datatype: String
        description: The region.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"REGIONID","summarizeBy":"none"}'
      - name: date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: date
        datatype: Date
        description: Date of the interval, NEM time (AEST all year).
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"date","summarizeBy":"none","formatString":"yyyy-MM-dd"}'
      - name: time
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: time
        datatype: Integer
        description: "Time of day as HHMM: 1435 is 14:35. The interval ends at it."
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"time","summarizeBy":"none"}'
      - name: price
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: price
        datatype: Decimal
        description: The regional reference price (AEMO's RRP), $/MWh.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"price","summarizeBy":"none","formatString":"$#,##0.00"}'
      - name: demand
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: demand
        datatype: Decimal
        description: "Operational demand, MW: rooftop solar is not in it."
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"demand","summarizeBy":"none","formatString":"#,##0.00"}'
      - name: net_interchange
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: net_interchange
        datatype: Decimal
        description: MW, positive when the region exports.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"net_interchange","summarizeBy":"none","formatString":"#,##0.00"}'
      - name: wind_available
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: wind_available
        datatype: Decimal
        description: MW the region's semi-scheduled wind could make. Blank before 2026-08.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"wind_available","summarizeBy":"none","formatString":"#,##0.00"}'
      - name: wind_curtailed
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: wind_curtailed
        datatype: Decimal
        description: MW of it that was not dispatched.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"wind_curtailed","summarizeBy":"none","formatString":"#,##0.00"}'
      - name: solar_available
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: solar_available
        datatype: Decimal
        description: MW the region's semi-scheduled solar could make. Blank before 2026-08.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"solar_available","summarizeBy":"none","formatString":"#,##0.00"}'
      - name: solar_curtailed
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: solar_curtailed
        datatype: Decimal
        description: MW of it that was not dispatched.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"solar_curtailed","summarizeBy":"none","formatString":"#,##0.00"}'
    custom_extensions:
      - vendor_name: POWER_BI
        data: '{"sourceLineageTag":"[mart].[fct_region]","partitions":[{"name":"fct_region","mode":"directLake","source":{"type":"entity","entityName":"fct_region","expressionSource":"DirectLake","schemaName":"mart"}}]}'
  - name: fct_interconnector
    source: mart.fct_interconnector
    description: "Flow on each link between regions, per 5 minutes, back to 2018. Positive from the first region in the id to the second (T-V-MNSP1 > 0: Tasmania to Victoria); the limits bound it in the same sign."
    fields:
      - name: interconnector
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: interconnector
        datatype: String
        description: AEMO's id of the link.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"interconnector","summarizeBy":"none"}'
      - name: date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: date
        datatype: Date
        description: Date of the interval, NEM time (AEST all year).
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"date","summarizeBy":"none","formatString":"yyyy-MM-dd"}'
      - name: time
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: time
        datatype: Integer
        description: "Time of day as HHMM: 1435 is 14:35. The interval ends at it."
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"time","summarizeBy":"none"}'
      - name: mw
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: mw
        datatype: Decimal
        description: The dispatch target flow, MW.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"mw","summarizeBy":"none","formatString":"#,##0.00"}'
      - name: export_limit
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: export_limit
        datatype: Decimal
        description: Limit in the positive direction, MW.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"export_limit","summarizeBy":"none","formatString":"#,##0.00"}'
      - name: import_limit
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: import_limit
        datatype: Decimal
        description: Limit in the negative direction, MW.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"import_limit","summarizeBy":"none","formatString":"#,##0.00"}'
    custom_extensions:
      - vendor_name: POWER_BI
        data: '{"sourceLineageTag":"[mart].[fct_interconnector]","partitions":[{"name":"fct_interconnector","mode":"directLake","source":{"type":"entity","entityName":"fct_interconnector","expressionSource":"DirectLake","schemaName":"mart"}}]}'
  - name: dim_interconnector
    source: mart.dim_interconnector
    primary_key:
      - interconnector
    description: "One row per link between two regions, from AEMO's MMSDM INTERCONNECTOR: what fct_interconnector's id stands for."
    fields:
      - name: interconnector
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: interconnector
        datatype: String
        description: AEMO's id of the link, as fct_interconnector carries it.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"interconnector","summarizeBy":"none"}'
      - name: from_region
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: from_region
        datatype: String
        description: The region a positive flow leaves.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"from_region","summarizeBy":"none"}'
      - name: to_region
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: to_region
        datatype: String
        description: The region a positive flow enters.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"to_region","summarizeBy":"none"}'
      - name: description
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: description
        datatype: String
        description: AEMO's description of the link.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"description","summarizeBy":"none"}'
    custom_extensions:
      - vendor_name: POWER_BI
        data: '{"sourceLineageTag":"[mart].[dim_interconnector]","partitions":[{"name":"dim_interconnector","mode":"directLake","source":{"type":"entity","entityName":"dim_interconnector","expressionSource":"DirectLake","schemaName":"mart"}}]}'
  - name: fct_curtailment
    source: mart.fct_curtailment
    description: Curtailment per semi-scheduled unit (wind and solar farms) and day, up to the newest whole day of the next-day files.
    fields:
      - name: DUID
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: DUID
        datatype: String
        description: The unit.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"DUID","summarizeBy":"none"}'
      - name: date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: date
        datatype: Date
        description: Date of the interval, NEM time (AEST all year).
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"date","summarizeBy":"none","formatString":"yyyy-MM-dd"}'
      - name: curtailed_mwh
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: curtailed_mwh
        datatype: Decimal
        description: "What the unit could have made and was not dispatched for: sum of max(availability - target, 0) / 12."
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"curtailed_mwh","summarizeBy":"none","formatString":"#,##0.00"}'
      - name: available_mwh
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: available_mwh
        datatype: Decimal
        description: What the unit could have made.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"available_mwh","summarizeBy":"none","formatString":"#,##0.00"}'
    custom_extensions:
      - vendor_name: POWER_BI
        data: '{"sourceLineageTag":"[mart].[fct_curtailment]","partitions":[{"name":"fct_curtailment","mode":"directLake","source":{"type":"entity","entityName":"fct_curtailment","expressionSource":"DirectLake","schemaName":"mart"}}]}'
  - name: fct_curtailment_region
    source: mart.fct_curtailment_region
    description: "Curtailment per region, day and fuel (Wind, Solar): the semi-scheduled farms (fct_curtailment) added up to their newest day, AEMO's regional figures after it (source). What the curtailment chart reads when no unit is picked."
    fields:
      - name: REGIONID
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: REGIONID
        datatype: String
        description: NEM region.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"REGIONID","summarizeBy":"none"}'
      - name: date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: date
        datatype: Date
        description: Date, NEM time (AEST all year).
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"date","summarizeBy":"none","formatString":"yyyy-MM-dd"}'
      - name: fuel
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: fuel
        datatype: String
        description: Wind or Solar.
        custom_extensions:
          - vendor_name: POWER_BI
            data: '{"sourceLineageTag":"fuel","summarizeBy":"none"}'
      - name: curtailed_mwh
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: curtailed_mwh
        datatype: Decimal
        description: Energy available and not dispatched.
        custom_extensions:
