name: 'iceberg_as_code'
version: '1.0.0'
profile: 'iceberg_as_code'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

# OneLake needs the curl transport on GitHub runners (the azure extension's default
# transport fails the OneLake TLS handshake), and temp_directory must be set before the
# first spill. Guarded off the ci target, which runs plain in-memory DuckDB with no
# azure extension.
on-run-start:
  - "{% if target.name != 'ci' %}SET GLOBAL azure_transport_option_type = '{{ env_var('AZURE_TRANSPORT_OPTION_TYPE', 'default') }}'{% else %}SELECT 1{% endif %}"
  - "{% if target.name != 'ci' %}SET GLOBAL temp_directory = '/tmp/duckdb_spill'{% else %}SELECT 1{% endif %}"

# Environment contract (set by the workflows / a local shell):
#   ONELAKE_TOKEN, ONELAKE_ENDPOINT, WAREHOUSE_PATH  -> profiles.yml (Iceberg attach)
#   FILES_PATH                                       -> get_root_path/get_csv_archive_path macros
#                                                       (the OneLake Files CSV archive)
#   download_limit, process_limit                    -> staging download + fact ingestion batch size
#   AZURE_TRANSPORT_OPTION_TYPE                      -> curl on GitHub runners, default elsewhere

models:
  iceberg_as_code:
    staging:
      +materialized: view
      +schema: landing
    dimensions:
      +materialized: table
      +schema: mart
    marts:
      +materialized: incremental
      +schema: landing
