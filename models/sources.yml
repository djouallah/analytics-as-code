version: 2

# The files the models read, declared so that the lineage graph shows them. None of them is
# a table: `{{ source(...) }}` compiles to the text given as external_location (dbt-duckdb).
# Descriptions are Markdown: the links are clickable in the dbt docs.

sources:
  - name: aemo
    description: >
      AEMO's public NEM report files ([nemweb.com.au](https://nemweb.com.au/Reports/Current/)),
      archived by stg_csv_archive_log as gzipped CSV under Files/csv/. Each table below is the
      set of archived files one fact model has still to load. The model's pre-hook puts their
      paths in a DuckDB variable (macros/pending_archive_files.sql) and the source compiles to
      that variable, so read_csv opens exactly those files and lists no folder. The variable
      only exists inside that model, so these sources can't carry tests or freshness checks.
    tables:
      - name: daily_dunit
        description: >
          PUBLIC_DAILY next-day reports, read by fct_scada for their DUNIT rows.
          Feed: [nemweb Daily_Reports](https://nemweb.com.au/Reports/Current/Daily_Reports/).
          History: [djouallah/aemo_data/data/archive](https://github.com/djouallah/aemo_data/tree/main/data/archive).
        config:
          meta:
            external_location: "getvariable('scada_daily_paths')"
      - name: daily_dregion
        description: >
          The same PUBLIC_DAILY files, read by fct_price for their DREGION rows.
          Feed: [nemweb Daily_Reports](https://nemweb.com.au/Reports/Current/Daily_Reports/).
          History: [djouallah/aemo_data/data/archive](https://github.com/djouallah/aemo_data/tree/main/data/archive).
        config:
          meta:
            external_location: "getvariable('price_daily_paths')"
      - name: dispatch_scada
        description: >
          PUBLIC_DISPATCHSCADA 5-minute files, read by fct_scada_today.
          Feed: [nemweb Dispatch_SCADA](https://nemweb.com.au/Reports/Current/Dispatch_SCADA/).
        config:
          meta:
            external_location: "getvariable('scada_today_paths')"
      - name: dispatchis_price
        description: >
          PUBLIC_DISPATCHIS 5-minute files, read by fct_price_today for their PRICE rows.
          Feed: [nemweb DispatchIS_Reports](https://nemweb.com.au/Reports/Current/DispatchIS_Reports/).
        config:
          meta:
            external_location: "getvariable('price_today_paths')"
      - name: dispatchis_regionsum
        description: >
          The same PUBLIC_DISPATCHIS files, read by fct_regionsum_today for their REGIONSUM rows.
          Feed: [nemweb DispatchIS_Reports](https://nemweb.com.au/Reports/Current/DispatchIS_Reports/).
        config:
          meta:
            external_location: "getvariable('regionsum_today_paths')"
      - name: dispatchis_interconnectorres
        description: >
          The same PUBLIC_DISPATCHIS files, read by fct_interconnector_today for their
          INTERCONNECTORRES rows, plus AEMO's monthly archive of that record
          (DISPATCHINTERCONNECTORRES, 2018-01 to 2026-08).
          Feeds: [nemweb DispatchIS_Reports](https://nemweb.com.au/Reports/Current/DispatchIS_Reports/),
          [MMSDM monthly archive](https://nemweb.com.au/Data_Archive/Wholesale_Electricity/MMSDM/).
        config:
          meta:
            external_location: "getvariable('interconnector_today_paths')"
      - name: rooftop_pv_actual
        description: >
          ROOFTOP_PV_ACTUAL half-hourly files, read by fct_rooftop_pv.
          Feeds: [current folder](https://nemweb.com.au/Reports/Current/ROOFTOP_PV/ACTUAL/),
          [weekly archives](https://nemweb.com.au/Reports/Archive/ROOFTOP_PV/ACTUAL/),
          [MMSDM monthly archive](https://nemweb.com.au/Data_Archive/Wholesale_Electricity/MMSDM/)
          (2018-01 to 2026-08).
        config:
          meta:
            external_location: "getvariable('rooftop_pv_paths')"

  - name: duid_reference
    description: >
      The unit reference files dim_duid is built from, written to Files/csv/duid/ by
      stg_csv_archive_log's daily DUID refresh. Each source compiles to the file's path.
      Most come from [djouallah/aemo_data](https://github.com/djouallah/aemo_data).
    config:
      meta:
        external_location: "{{ env_var('FILES_PATH', '/tmp') | trim }}/csv/duid/{name}.csv"
    tables:
      - name: registration
        description: >
          Generator sheet (PU and Scheduled Loads) of AEMO's NEM Registration and Exemption List.
          Read from the newest weekly copy in
          [djouallah/aemo_data/data/duid/registration](https://github.com/djouallah/aemo_data/tree/main/data/duid/registration),
          which a workflow there downloads from
          [AEMO](https://www.aemo.com.au/-/media/Files/Electricity/NEM/Participant_Information/NEM-Registration-and-Exemption-List.xls).
      - name: duid_unregistered
        description: >
          The units in the data that the registration list doesn't have, generated from AEMO's
          MMSDM registration history.
          File: [djouallah/aemo_data/duid_unregistered.csv](https://github.com/djouallah/aemo_data/blob/main/duid_unregistered.csv)
          (its commits say how it was built).
      - name: facilities
        description: >
          WA facilities, from AEMO WA.
          File: [facilities.csv](https://data.wa.aemo.com.au/datafiles/post-facilities/facilities.csv).
      - name: WA_ENERGY
        description: >
          Fuel and technology of the WA facilities.
          File: [djouallah/aemo_data/WA_ENERGY.csv](https://github.com/djouallah/aemo_data/blob/main/WA_ENERGY.csv).
      - name: geo_data
        description: >
          Latitude and longitude per DUID.
          File: [djouallah/aemo_data/geo_data.csv](https://github.com/djouallah/aemo_data/blob/main/geo_data.csv).
