version: 2

models:
  - name: dim_duid
    description: Dimension table for DUID (Dispatchable Unit Identifier), covering NEM units plus WA facilities. NEM units come from AEMO's current registration list and, for the units in the data that are not on it (retired plant, replaced DUIDs), from duid_unregistered.csv
    columns:
      - name: DUID
        description: Unique identifier for dispatchable unit
        tests:
          - unique
          - not_null
      - name: Region
        description: NEM region the unit dispatches into (WA1 for WA facilities)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['QLD1', 'NSW1', 'VIC1', 'SA1', 'TAS1', 'WA1']
      - name: State
        description: State name derived from the region
      - name: FuelSourceDescriptor
        description: Fuel/technology of the unit (e.g. Solar, Wind, Coal), title-cased; null for the unlisted loads AEMO gives no energy source for
      - name: Participant
        description: Registered market participant that operates the unit
      - name: latitude
        description: Unit latitude (from the geo reference CSV; null when unknown)
      - name: longitude
        description: Unit longitude (from the geo reference CSV; null when unknown)
      - name: StationName
        description: Power station the unit belongs to (AEMO registration list; null for WA)
      - name: TechnologyType
        description: AEMO technology descriptor, e.g. "Battery and Inverter", "Steam Sub-Critical"; null for WA and for units not on the registration list
      - name: RegCapMW
        description: Registered generating capacity (MW); the capacity-factor denominator
      - name: MaxCapMW
        description: Maximum generating capacity (MW)
      - name: StorageMWh
        description: Maximum storage capacity (MWh) for batteries; null otherwise
      - name: Renewable
        description: True when the unit's fuel is renewable (solar, wind, water, bagasse, biogas, landfill gas, sewerage gas - the list is in dim_duid.sql); false otherwise, batteries and units with no fuel included
        tests:
          - not_null
      - name: Classification
        description: How AEMO dispatches the unit, from the registration list - Scheduled, Semi-Scheduled (wind and solar farms that can be capped; curtailment is measured on these) or Non-Scheduled; null for WA and for units not on the list
        tests:
          - accepted_values:
              arguments:
                values: ['Scheduled', 'Semi-Scheduled', 'Non-Scheduled']

  - name: dim_calendar
    description: One row per day from 2018-03-06 (where the history starts) to two years ahead
    columns:
      - name: date
        description: Calendar date
        tests:
          - unique
          - not_null
      - name: year
        description: Calendar year of the date
      - name: month
        description: Month of the date, 1-12

  - name: dim_region
    description: For Power BI - one row per region, what the unit, the regional and the rooftop tables are filtered by. From dim_duid, so WA1 is in it
    columns:
      - name: Region
        description: QLD1, NSW1, VIC1, SA1, TAS1, and WA1 (Western Australia, another market)
        tests:
          - unique
          - not_null
      - name: State
        description: The region's name

  - name: dim_time
    description: For Power BI - the 288 five-minute times of a day, the time axis every 5-minute fact is read against, and what a measure reads rooftop solar against between two half hours
    columns:
      - name: time
        description: Time of day as an HHMM integer (1435 is 14:35), as the facts carry it
        tests:
          - unique
          - not_null
      - name: minute
        description: The same time as minutes since midnight, 0 to 1435
        tests:
          - not_null
      - name: hour
        description: Hour of day, 0 to 23
