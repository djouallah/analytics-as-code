version: 2

models:
  - name: processed_files
    description: The archived files each landing fact has loaded, appended by the fact's post-hook once its batch's MERGE committed. A fact's pending files are the archive log minus this table; a rebuild appends a reset row (csv_filename NULL) so the refill starts over. Seeded from the facts' file columns on its first build
    columns:
      - name: model
        description: The landing fact (fct_scada, fct_price, fct_scada_today, fct_price_today, fct_regionsum_today, fct_interconnector_today, fct_rooftop_pv)
      - name: csv_filename
        description: The archived file, as the fact's `file` column names it; NULL for a reset row
      - name: processed_at
        description: When the batch committed, or when the reset was asked for

  - name: fct_price
    description: Regional spot prices, demand and supply every 5 minutes, from the DREGION rows of AEMO's next-day PUBLIC_DAILY files (history back to 2018)
    columns:
      - name: REGIONID
        description: NEM region (QLD1, NSW1, VIC1, SA1, TAS1); the files carry no WA prices
        tests:
          - not_null
          - accepted_values:
              values: ['QLD1', 'NSW1', 'VIC1', 'SA1', 'TAS1', 'WA1']
      - name: SETTLEMENTDATE
        description: End of the 5-minute dispatch interval - AEST wall clock stored as timestamptz labelled UTC, so read it in a UTC session
        tests:
          - not_null
      - name: RRP
        description: Regional Reference Price ($/MWh) for the interval
      - name: TOTALDEMAND
        description: Operational demand (MW); rooftop solar is not in it. The dashboard's demand for history
      - name: NETINTERCHANGE
        description: Net interconnector flow out of the region (MW); positive = export
      - name: INTERVENTION
        description: AEMO intervention flag (0 = the pricing run, which every reader filters on); part of the merge key
        tests:
          - not_null
      - name: DATE
        description: Calendar date of SETTLEMENTDATE, cast from the file's string (right in any session zone)
      - name: file
        description: Source CSV filename the row was ingested from (part of the merge key)
        tests:
          - not_null

  - name: fct_scada
    description: Output and dispatch per unit every 5 minutes, from the DUNIT rows of AEMO's next-day PUBLIC_DAILY files (history back to 2018)
    columns:
      # No relationships test to dim_duid here: dim_duid holds the registered DUIDs plus the
      # unlisted ones that generated, while fct_scada goes back to 2018 and also carries units
      # only ever dispatched at 0 MW, so the test could never be 0 (it warned on 82,304,828
      # rows when dim_duid held the registered ones alone). The meaningful version --
      # do DUIDs generating *right now* exist in dim_duid -- lives in
      # tests/assert_recent_scada_duids_registered.sql.
      - name: DUID
        description: Dispatchable Unit Identifier of the generating unit
        tests:
          - not_null
      - name: SETTLEMENTDATE
        description: End of the 5-minute dispatch interval - AEST wall clock stored as timestamptz labelled UTC, so read it in a UTC session
        tests:
          - not_null
      - name: INITIALMW
        description: Metered output of the unit at the start of the interval (MW); negative when a battery charges. Rows at 0 MW are kept here and left out by fct_summary
      - name: TOTALCLEARED
        description: Dispatch target for the end of the interval (MW)
      - name: AVAILABILITY
        description: What the unit offered as available (MW); with TOTALCLEARED, what a curtailment measure would read
      - name: INTERVENTION
        description: AEMO intervention flag (0 = the pricing run, which every reader filters on); part of the merge key
        tests:
          - not_null
      - name: DATE
        description: Calendar date of SETTLEMENTDATE, cast from the file's string (right in any session zone)
      - name: file
        description: Source CSV filename the row was ingested from (part of the merge key)
        tests:
          - not_null

  - name: fct_price_today
    description: Regional spot prices from the PRICE rows of AEMO's 5-minute DispatchIS files, minutes after each interval. Never trimmed - it holds every file loaded since 2026-08; fct_region and fct_summary read it
    columns:
      - name: REGIONID
        description: NEM region (QLD1, NSW1, VIC1, SA1, TAS1); the files carry no WA prices
        tests:
          - not_null
          - accepted_values:
              values: ['QLD1', 'NSW1', 'VIC1', 'SA1', 'TAS1', 'WA1']
      - name: SETTLEMENTDATE
        description: 5-minute dispatch interval timestamp (timestamptz)
        tests:
          - not_null
      - name: RRP
        description: Regional Reference Price ($/MWh) for the interval
      - name: INTERVENTION
        description: AEMO intervention flag (0 = the pricing run, which every reader filters on); part of the merge key
        tests:
          - not_null
      - name: file
        description: Source CSV filename the row was ingested from (part of the merge key)
        tests:
          - not_null

  - name: fct_interconnector_today
    description: Interconnector flows and limits every 5 minutes since 2018, from the INTERCONNECTORRES rows of the archived DispatchIS files (2026-08 on) and of AEMO's monthly MMSDM archive before that
    columns:
      - name: INTERCONNECTORID
        description: AEMO interconnector id; flows are positive from its first region to its second
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['N-Q-MNSP1', 'NSW1-QLD1', 'NSW1-SA1', 'T-V-MNSP1', 'V-S-MNSP1', 'V-SA', 'VIC1-NSW1']
              config:
                severity: warn
      - name: SETTLEMENTDATE
        description: 5-minute dispatch interval timestamp (timestamptz)
        tests:
          - not_null
      - name: MWFLOW
        description: Dispatch target flow (MW); the flow the dashboard shows
      - name: METEREDMWFLOW
        description: Metered flow at the start of the interval (MW); not in fct_interconnector
      - name: INTERVENTION
        description: AEMO intervention flag (0 = the pricing run, which every reader filters on); part of the merge key
        tests:
          - not_null
      - name: EXPORTLIMIT
        description: Flow limit in the positive direction (MW)
      - name: IMPORTLIMIT
        description: Flow limit in the negative direction (MW)
      - name: file
        description: Source CSV filename the row was ingested from (part of the merge key)
        tests:
          - not_null

  - name: fct_regionsum_today
    description: Regional demand, net interchange and supply every 5 minutes, from the REGIONSUM rows of the archived DispatchIS files
    columns:
      - name: REGIONID
        description: NEM region identifier
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['QLD1', 'NSW1', 'VIC1', 'SA1', 'TAS1']
              config:
                severity: warn
      - name: SETTLEMENTDATE
        description: 5-minute dispatch interval timestamp (timestamptz)
        tests:
          - not_null
      - name: TOTALDEMAND
        description: Operational demand (MW); rooftop solar is not in it
      - name: NETINTERCHANGE
        description: Net interconnector flow out of the region (MW); positive = export
      - name: INTERVENTION
        description: AEMO intervention flag (0 = the pricing run, which every reader filters on); part of the merge key
        tests:
          - not_null
      - name: file
        description: Source CSV filename the row was ingested from (part of the merge key)
        tests:
          - not_null

  - name: fct_rooftop_pv
    description: Rooftop solar output per region every half hour, as AEMO estimates it (ROOFTOP_PV_ACTUAL) - an estimate, not a meter reading, kept as published
    columns:
      - name: REGIONID
        description: NEM region identifier; the older monthly files also carry sub-regions (QLDC, QLDN, QLDS, TASN, TASS)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['QLD1', 'NSW1', 'VIC1', 'SA1', 'TAS1', 'QLDC', 'QLDN', 'QLDS', 'TASN', 'TASS']
              config:
                severity: warn
      - name: INTERVAL_DATETIME
        description: End of the half-hour interval - AEST wall clock stored as timestamptz labelled UTC
        tests:
          - not_null
      - name: POWER
        description: Estimated rooftop generation at the end of the interval (MW); blank when AEMO had no estimate
      - name: QI
        description: AEMO's quality indicator for the estimate (1 = measurement, 0.6 = satellite, 0 = none)
      - name: TYPE
        description: How it was estimated - MEASUREMENT, SATELLITE or DAILY
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['MEASUREMENT', 'SATELLITE', 'DAILY']
              config:
                severity: warn
      - name: file
        description: Source CSV filename the row was ingested from (part of the merge key)
        tests:
          - not_null

  - name: fct_scada_today
    description: SCADA reading per unit from AEMO's 5-minute Dispatch_SCADA files, minutes after each interval. Never trimmed - it holds every file loaded; fct_summary reads the intervals after the newest next-day file. Rows at 0 MW are not loaded, and there is no INTERVENTION column
    columns:
      # Same reasoning as fct_scada above -- no relationships test to dim_duid.
      - name: DUID
        description: Dispatchable Unit Identifier of the generating unit
        tests:
          - not_null
      - name: SETTLEMENTDATE
        description: End of the 5-minute dispatch interval - AEST wall clock stored as timestamptz labelled UTC, so read it in a UTC session
        tests:
          - not_null
      - name: INITIALMW
        description: The file's SCADAVALUE (MW), under fct_scada's column name so fct_summary reads both alike. Not the same AEMO column as fct_scada.INITIALMW - a small step where the two meet is expected
      - name: file
        description: Source CSV filename the row was ingested from (part of the merge key)
        tests:
          - not_null

  - name: fct_summary
    description: The table Power BI reads - one row per unit and 5 minutes, joining its output (mw) to the price of its region, so a report joins no two facts. The daily files where they have landed, the intraday feed after them. Ported from the sibling repos; in schema mart
    columns:
      - name: date
        description: Calendar date of the dispatch interval, NEM time
        tests:
          - not_null
      - name: time
        description: Time of day as an HHMM integer, 5-minute grain
      - name: DUID
        description: Dispatchable Unit Identifier of the generating unit; always one dim_duid has (inner join)
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_duid')
                field: DUID
      - name: mw
        description: Output for the interval (MW), DECIMAL(18,4); negative when a battery charges. Rows at 0 MW are left out
        tests:
          - not_null
      - name: price
        description: Regional Reference Price of the unit's region for the interval ($/MWh), DECIMAL(18,4)
        tests:
          - not_null
      - name: cutoff
        description: Newest SETTLEMENTDATE in the facts when the row was written. Provenance only

  - name: fct_region
    description: For Power BI - price, demand and net interchange per region and 5 minutes, with the region's semi-scheduled wind and solar. The intraday record where the price and the REGIONSUM rows both have the interval, else the next-day record. In schema mart
    columns:
      - name: REGIONID
        description: NEM region (QLD1, NSW1, VIC1, SA1, TAS1)
        tests:
          - not_null
      - name: date
        description: Calendar date of the dispatch interval, NEM time
        tests:
          - not_null
      - name: time
        description: Time of day as an HHMM integer, 5-minute grain; the interval ends at it
        tests:
          - not_null
      - name: price
        description: Regional Reference Price ($/MWh), DECIMAL(18,4)
        tests:
          - not_null
      - name: demand
        description: Operational demand (MW); rooftop solar is not in it
      - name: net_interchange
        description: Net flow out of the region (MW); positive = export
      - name: wind_available
        description: MW the region's semi-scheduled wind could make; blank before the intraday feeds (2026-08)
      - name: wind_curtailed
        description: MW of it that was not dispatched - available less the dispatch target, never below 0
      - name: solar_available
        description: MW the region's semi-scheduled solar could make; blank before the intraday feeds (2026-08)
      - name: solar_curtailed
        description: MW of it that was not dispatched

  - name: fct_rooftop
    description: For Power BI - rooftop solar per region and half hour, AEMO's MEASUREMENT estimate as published, with the half hour's average price. Its own table, not units; nothing interpolated or carried forward is stored. In schema mart
    columns:
      - name: REGIONID
        description: NEM region (QLD1, NSW1, VIC1, SA1, TAS1)
        tests:
          - not_null
      - name: date
        description: Calendar date of the end of the half hour, NEM time
        tests:
          - not_null
      - name: time
        description: End of the half hour as an HHMM integer
        tests:
          - not_null
      - name: mw
        description: Estimated rooftop output at the end of the half hour (MW); 0 is stored, a blank estimate is not. Energy is SUM(mw) / 2
        tests:
          - not_null
      - name: price
        description: Average of the region's six 5-minute prices in the half hour ($/MWh)
        tests:
          - not_null

  - name: fct_interconnector
    description: For Power BI - flow on each link between regions per 5 minutes since 2018, the pricing run, one row per interval. In schema mart
    columns:
      - name: interconnector
        description: AEMO interconnector id; the flow is positive from its first region to its second
        tests:
          - not_null
      - name: date
        description: Calendar date of the dispatch interval, NEM time
        tests:
          - not_null
      - name: time
        description: Time of day as an HHMM integer, 5-minute grain
        tests:
          - not_null
      - name: mw
        description: Dispatch target flow MWFLOW (MW), not the metered flow
      - name: export_limit
        description: Flow limit in the positive direction (MW)
      - name: import_limit
        description: Flow limit in the negative direction (MW)

  - name: fct_curtailment
    description: For Power BI - curtailed and available energy per semi-scheduled unit and day, from the next-day files. A day is written once fct_scada holds its 288 intervals. In schema mart
    columns:
      - name: DUID
        description: The unit; Semi-Scheduled in dim_duid when its day was written
        tests:
          - not_null
      - name: date
        description: Calendar date, NEM time
        tests:
          - not_null
      - name: curtailed_mwh
        description: Sum over the day of max(availability - dispatch target, 0) / 12
        tests:
          - not_null
      - name: available_mwh
        description: What the unit could have made - the denominator of a curtailment rate
        tests:
          - not_null

  - name: fct_region_daily
    description: For Power BI and the dashboard's long ranges - price, demand and net interchange per region and day, the plain average of the day's intervals. A day is written once fct_region holds its 288 intervals. In schema mart
    columns:
      - name: REGIONID
        description: NEM region
        tests:
          - not_null
      - name: date
        description: Calendar date, NEM time
        tests:
          - not_null
      - name: price
        description: Average Regional Reference Price of the day ($/MWh)
        tests:
          - not_null
      - name: demand
        description: Average operational demand of the day (MW); the day's energy is demand * 24
      - name: net_interchange
        description: Average net flow out of the region (MW); positive = export

  - name: fct_summary_daily
    description: For Power BI and the dashboard's long ranges - net energy per unit and day, with the day's average price of the unit's region. A day is written once the next-day files hold it whole. In schema mart
    columns:
      - name: DUID
        description: The unit
        tests:
          - not_null
      - name: date
        description: Calendar date, NEM time
        tests:
          - not_null
      - name: mwh
        description: The day's net energy (MWh) - a battery's charging is taken off its output
        tests:
          - not_null
      - name: price
        description: The day's average price of the unit's region ($/MWh), from fct_region_daily
        tests:
          - not_null
      - name: output_mwh
        description: The day's output (MWh) - the 5-minute intervals above 0 MW, what [Generation MWh] sums. DOUBLE, like the next two - an exact sum
        tests:
          - not_null
      - name: charging_mwh
        description: The day's charging (MWh, negative) - the 5-minute intervals below 0 MW
        tests:
          - not_null
      - name: revenue
        description: What the day's output earned ($) - each interval's output at its own 5-minute price
        tests:
          - not_null

  - name: fct_summary_hourly
    description: For Power BI and the dashboard's long ranges - output energy per unit, month and hour of day, whole months only (dim_month). In schema mart
    columns:
      - name: DUID
        description: The unit
        tests:
          - not_null
      - name: month
        description: The month's first day
        tests:
          - not_null
      - name: hour
        description: Hour of day, 0-23, as time // 100 (the interval ending 14:00 is hour 14)
        tests:
          - not_null
      - name: mwh
        description: Output energy at that hour over the month (MWh); charging is left out
        tests:
          - not_null

  - name: fct_region_hourly
    description: For Power BI and the dashboard's long ranges - average price per region, month and hour of day, whole months only (dim_month). In schema mart
    columns:
      - name: REGIONID
        description: NEM region
        tests:
          - not_null
      - name: month
        description: The month's first day
        tests:
          - not_null
      - name: hour
        description: Hour of day, 0-23, as time // 100
        tests:
          - not_null
      - name: price
        description: Plain average of the month's prices at that hour ($/MWh)
        tests:
          - not_null
      - name: intervals
        description: How many intervals were averaged - the weight when months are combined
        tests:
          - not_null

exposures:
  - name: dashboard_summary
    type: application
    description: "The NemTracker dashboard, and the Power BI model: both read these tables through one semantic model (semantic_model/model.bim). scripts/cache_catalog.py copies them as they are into the dashboard's .duckdb files (mart_dim / mart_today / mart_agg / mart_<year>_h<n>)"
    depends_on:
      - ref('fct_summary')
      - ref('fct_region')
      - ref('fct_rooftop')
      - ref('fct_interconnector')
      - ref('fct_curtailment')
      - ref('fct_summary_daily')
      - ref('fct_region_daily')
      - ref('fct_summary_hourly')
      - ref('fct_region_hourly')
      - ref('dim_duid')
      - ref('dim_region')
      - ref('dim_calendar')
      - ref('dim_time')
      - ref('dim_month')
    owner:
      name: team
