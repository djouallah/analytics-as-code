version: 2

models:
  - name: fct_price
    description: Regional spot prices from daily AEMO dispatch files (5-minute intervals)
    columns:
      - name: REGIONID
        description: NEM region (plus WA1 for the WA market)
        tests:
          - not_null
          - accepted_values:
              values: ['QLD1', 'NSW1', 'VIC1', 'SA1', 'TAS1', 'WA1']
      - name: SETTLEMENTDATE
        description: 5-minute dispatch interval timestamp (timestamptz)
        tests:
          - not_null
      - name: RRP
        description: Regional Reference Price ($/MWh) for the interval
      - name: INTERVENTION
        description: AEMO intervention flag (0 = normal dispatch run)
      - name: file
        description: Source CSV filename the row was ingested from (part of the merge key)
        tests:
          - not_null

  - name: fct_scada
    description: Generation SCADA readings per unit from daily AEMO dispatch files
    columns:
      # No relationships test to dim_duid here: dim_duid holds only *currently registered*
      # DUIDs while fct_scada goes back to 2018 and is full of retired ones, so the test
      # could never be 0 (it warned on 82,304,828 rows). The meaningful version --
      # do DUIDs generating *right now* exist in dim_duid -- lives in
      # tests/assert_recent_scada_duids_registered.sql.
      - name: DUID
        description: Dispatchable Unit Identifier of the generating unit
        tests:
          - not_null
      - name: SETTLEMENTDATE
        description: 5-minute dispatch interval timestamp (timestamptz)
        tests:
          - not_null
      - name: INITIALMW
        description: Metered output of the unit at the start of the interval (MW)
      - name: file
        description: Source CSV filename the row was ingested from (part of the merge key)
        tests:
          - not_null

  - name: fct_price_today
    description: Intraday regional spot prices from AEMO 5-minute dispatch files
    columns:
      - name: REGIONID
        description: NEM region (plus WA1 for the WA market)
        tests:
          - not_null
          - accepted_values:
              values: ['QLD1', 'NSW1', 'VIC1', 'SA1', 'TAS1', 'WA1']
      - name: SETTLEMENTDATE
        description: 5-minute dispatch interval timestamp (timestamptz)
        tests:
          - not_null
      - name: RRP
        description: Regional Reference Price ($/MWh) for the interval
      - name: file
        description: Source CSV filename the row was ingested from (part of the merge key)
        tests:
          - not_null

  - name: fct_interconnector_today
    description: Interconnector flows and limits every 5 minutes, from the INTERCONNECTORRES rows of the archived DispatchIS files
    columns:
      - name: INTERCONNECTORID
        description: AEMO interconnector id; flows are positive from its first region to its second
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['N-Q-MNSP1', 'NSW1-QLD1', 'NSW1-SA1', 'T-V-MNSP1', 'V-S-MNSP1', 'V-SA', 'VIC1-NSW1']
              config:
                severity: warn
      - name: SETTLEMENTDATE
        description: 5-minute dispatch interval timestamp (timestamptz)
        tests:
          - not_null
      - name: MWFLOW
        description: Dispatch target flow (MW)
      - name: EXPORTLIMIT
        description: Flow limit in the positive direction (MW)
      - name: IMPORTLIMIT
        description: Flow limit in the negative direction (MW)
      - name: file
        description: Source CSV filename the row was ingested from (part of the merge key)
        tests:
          - not_null

  - name: fct_scada_today
    description: Intraday generation SCADA readings per unit from AEMO dispatch files
    columns:
      # Same reasoning as fct_scada above -- no relationships test to dim_duid.
      - name: DUID
        description: Dispatchable Unit Identifier of the generating unit
        tests:
          - not_null
      - name: SETTLEMENTDATE
        description: 5-minute dispatch interval timestamp (timestamptz)
        tests:
          - not_null
      - name: INITIALMW
        description: Metered output of the unit at the start of the interval (MW)
      - name: file
        description: Source CSV filename the row was ingested from (part of the merge key)
        tests:
          - not_null

exposures:
  - name: dashboard_summary
    type: application
    description: "Exports scada + price + dim_duid + dim_calendar into the dashboard .duckdb files (energy_dim / energy_today / energy_daily_agg / energy_data_<year>_h<n>) via scripts/cache_catalog.py"
    depends_on:
      - ref('fct_scada')
      - ref('fct_price')
      - ref('fct_scada_today')
      - ref('fct_price_today')
      - ref('dim_duid')
      - ref('dim_calendar')
    owner:
      name: team
