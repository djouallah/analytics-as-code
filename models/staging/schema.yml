version: 2

models:
  - name: stg_csv_archive_log
    description: Log of all downloaded CSV files
    columns:
      - name: source_filename
        description: Name of the downloaded file
        tests:
          - not_null
      - name: source_type
        description: Type of source (daily, scada_today, price_today, interconnector_monthly, rooftop_today / rooftop_weekly / rooftop_monthly, or one of the duid_* reference files)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['daily', 'scada_today', 'price_today', 'interconnector_monthly', 'rooftop_today', 'rooftop_weekly', 'rooftop_monthly', 'duid_data', 'duid_facilities', 'duid_wa_energy', 'duid_geo_data', 'duid_registration', 'duid_unregistered']
      - name: csv_filename
        description: Actual CSV filename (without extension) extracted from ZIP
        tests:
          - not_null
      - name: archived_at
        description: Timestamp when file was archived
        tests:
          - not_null
