version: 2

models:
  - name: stg_csv_archive_log
    description: One row per archived CSV - what the fact models' pre-hooks read to find the files they still have to load. A materialization of Files/csv_archive_log.parquet, the durable log; each run appends the rows the table is missing
    columns:
      - name: archive_path
        description: Path of the gzipped CSV under Files/csv (/<folder>/<file>.gz); what the pre-hooks pass to read_csv
      - name: source_filename
        description: Name of the downloaded file
        tests:
          - not_null
      - name: source_type
        description: Type of source (daily, scada_today, price_today, interconnector_monthly, rooftop_today / rooftop_weekly / rooftop_monthly, or one of the duid_* reference files)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['daily', 'scada_today', 'price_today', 'interconnector_monthly', 'rooftop_today', 'rooftop_weekly', 'rooftop_monthly', 'duid_data', 'duid_facilities', 'duid_wa_energy', 'duid_geo_data', 'duid_registration', 'duid_unregistered', 'duid_genunits', 'duid_dualloc', 'duid_interconnector']
      - name: csv_filename
        description: Actual CSV filename (without extension) extracted from ZIP
        tests:
          - not_null
      - name: archived_at
        description: Timestamp when file was archived
        tests:
          - not_null
