name: Import OneLake

# The same .duckdb files import_data.yml builds for GitHub Pages, published to the lakehouse
# the Fabric app (dashboard/fabric_app/wasm/) reads. Every run copies all of the history (ALL_PERIODS): there is
# no deployed copy on OneLake to add the newer half-years to.
on:
  schedule:
    - cron: '30 22 * * *'  # 8:30am AEST, after the daily refresh and maintenance
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: import-onelake
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC: the catalog login, and deploy_onelake.py's login to the app's tenant

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # OneLake Iceberg REST catalog — only the .venv-read (export) steps touch it.
      ONELAKE_ENDPOINT: https://onelake.table.fabric.microsoft.com/iceberg
      WAREHOUSE_PATH: ${{ vars.WS_ID }}/${{ vars.LH_ID }}
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      ALL_PERIODS: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/workflows/import_onelake.yml
      - name: Cache DuckDB extensions
        uses: actions/cache@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-ext-import-onelake-${{ runner.os }}-${{ hashFiles('requirements.txt', '.github/workflows/import_onelake.yml') }}

      - name: Azure federated login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Mint OneLake token
        run: |
          TOKEN=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "ONELAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          # The two duckdbs of import_data.yml, for the same reason: read the catalog with
          # the build that writes it, write the .duckdb files in the format the page's
          # DuckDB-WASM opens. Parquet is the handoff between them.
          python -m venv .venv-read
          .venv-read/bin/pip install -q "duckdb==2.0.0.dev2610011535"
          python -m venv .venv-write
          .venv-write/bin/pip install -q "duckdb==1.5.6"
          pip install -q "azure-identity==1.26.0" "azure-storage-file-datalake==12.26.0"

      - name: Copy the mart tables
        # A plain copy, with no rule of its own (scripts/cache_catalog.py).
        run: |
          for group in dim agg today history; do
            echo "::group::$group"
            .venv-read/bin/python scripts/cache_catalog.py export $group
            .venv-write/bin/python scripts/cache_catalog.py build $group
            echo "::endgroup::"
          done

      - name: Publish to the app's lakehouse
        env:
          LAKE_TENANT_ID: ${{ vars.LAKE_TENANT_ID }}
          LAKE_CLIENT_ID: ${{ vars.LAKE_CLIENT_ID }}
        run: python scripts/deploy_onelake.py
