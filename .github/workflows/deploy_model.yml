name: Deploy Semantic Model

# Publishes semantic_model/model.bim (a Direct Lake model over the catalog's
# Iceberg tables) and the Power BI report on it (dashboard/powerbi_report/nem.Report) to the
# workspace that holds the lakehouse, then refreshes the model and asks it, in DAX over
# XMLA, a row count per table and its measures (scripts/check_model.py).
#
# Manual only: it creates or updates two Fabric items. It touches no table and no dashboard
# file. The identity is the catalog's (the same OIDC login as Process Data), so the model
# is owned by it and reads OneLake as it.

# A run that asks the model the page's queries says so in its name: the last green one is
# the commit the next parity compares with (`since`).
run-name: Deploy Semantic Model${{ inputs.parity && ' + parity' || '' }}

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish and refresh the model first (off: only the checks, on the model as deployed; a missing one is published)"
        type: boolean
        default: true
      parity:
        description: "Power BI parity: ask the deployed model the page's queries (it costs the capacity's CU)"
        type: boolean
        default: false
      since:
        description: "Parity: ask only the queries whose DAX, SQL or measures changed since this commit (empty: the last green parity run's; all: every query)"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-model
  cancel-in-progress: false

permissions:
  contents: read
  actions: read     # the last green run of this workflow: the commit parity compares with
  id-token: write   # OIDC federated login to Azure

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      WS_ID: ${{ vars.WS_ID }}
      LH_ID: ${{ vars.LH_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned exactly, like every other version here (AGENTS.md, version policy).
      - run: pip install -q "fabric-cicd==1.3.0" "pythonnet==3.1.0"
      - name: Install the ADOMD.NET client
        # What scripts/check_model.py asks its DAX through (XMLA). The .NET Core build runs on
        # Linux under pythonnet; publishing a throwaway project that references it puts the
        # DLL and everything it depends on in one folder.
        run: |
          set -euo pipefail
          proj="$RUNNER_TEMP/adomd"
          mkdir -p "$proj" && cd "$proj"
          dotnet new console -o . --force >/dev/null
          dotnet add package Microsoft.AnalysisServices.AdomdClient.NetCore.retail.amd64 --version 19.84.1 >/dev/null
          dotnet publish -c Release -o publish >/dev/null
          test -f "$proj/publish/Microsoft.AnalysisServices.AdomdClient.dll"
          echo "ADOMD_DIR=$proj/publish" >> "$GITHUB_ENV"
      - name: Azure federated login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Is the model there?
        # Without `publish`, the checks ask the model as deployed: one the workspace does not
        # have is published and refreshed first.
        if: ${{ !inputs.publish }}
        run: |
          set -euo pipefail
          token=$(az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken -o tsv)
          name=$(jq -r .metadata.displayName semantic_model/.platform)
          found=$(curl -fsS -H "Authorization: Bearer $token" "https://api.fabric.microsoft.com/v1/workspaces/$WS_ID/semanticModels" \
            | jq --arg n "$name" '[.value[] | select(.displayName == $n)] | length')
          if [ "$found" = 0 ]; then
            echo "::notice::no semantic model $name in the workspace: publishing it"
            echo "PUBLISH=true" >> "$GITHUB_ENV"
          fi
      - name: Publish the model and the report
        if: inputs.publish || env.PUBLISH == 'true'
        run: python scripts/deploy_model.py
      - name: Mint Power BI token
        run: |
          TOKEN=$(az account get-access-token --resource https://analysis.windows.net/powerbi/api --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "POWERBI_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Refresh it and query it
        if: inputs.publish || env.PUBLISH == 'true'
        env:
          PYTHONNET_RUNTIME: coreclr
        run: python scripts/check_model.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: The dashboard's files
        # What the dashboard has deployed (scripts/parity/fetch_data.sh). Both checks below
        # run over them.
        run: |
          bash scripts/parity/fetch_data.sh "$RUNNER_TEMP/data"
          cd scripts/parity && npm ci --no-audit --no-fund
      - name: Power BI parity, the page's queries on the model and on the dashboard's files
        # scripts/parity: every query the page sends, as the compiler writes its DAX and its
        # SQL, run over the files the dashboard has deployed (DuckDB) and asked of the model
        # just deployed (XMLA); the rows have to be the same. The model is the reference.
        # Only when asked (`parity`): the queries cost the capacity's CU.
        if: inputs.parity
        env:
          PYTHONNET_RUNTIME: coreclr
          SINCE: ${{ inputs.since }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/data"
          (cd scripts/parity && node page_queries.mjs "$data" "$RUNNER_TEMP/parity.json")
          # since: the same queries built from that commit's compiler, queries and model;
          # a query whose key is the same there is not asked again. By default the commit of
          # the last green run that asked them (its name ends in "+ parity"): what it asked
          # passed, and what it did not ask was unchanged since the one before. `all` asks
          # every query. Every run before 2026-10-08 asked them, under the plain name.
          since=()
          if [ -z "$SINCE" ]; then
            SINCE=$(gh run list --workflow deploy_model.yml --status success -L 50 --json headSha,displayTitle,createdAt \
              --jq '[.[] | select((.displayTitle | endswith("+ parity")) or .createdAt < "2026-10-08")][0].headSha // ""')
            echo "comparing with the last green parity run's commit: ${SINCE:-none, every query is asked}"
          fi
          [ "$SINCE" = all ] && SINCE=
          if [ -n "$SINCE" ]; then
            git worktree add -q "$RUNNER_TEMP/since" "$SINCE"
            (cd scripts/parity && node page_queries.mjs "$data" "$RUNNER_TEMP/since.json" "$RUNNER_TEMP/since")
            since=("$RUNNER_TEMP/since.json")
          fi
          python scripts/parity_model.py "$RUNNER_TEMP/parity.json" "${since[@]}"
      - name: The SQL page against the page through the model
        # scripts/parity/sql_page.mjs: every question of the SQL page (dashboard/github/sql)
        # against the same question of the DAX page (dashboard/github/dax), over the
        # dashboard's files: the same rows. The parity holds the DAX page's to the model, so
        # this holds the SQL page's to it too. A changed measure that the SQL page does not
        # follow fails here. It asks the model nothing, so it always runs.
        if: ${{ !cancelled() }}
        run: cd scripts/parity && node sql_page.mjs "$RUNNER_TEMP/data"
