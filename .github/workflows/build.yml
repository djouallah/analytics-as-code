name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Two quick pushes used to run in parallel and race both the "Update dbt docs" commit
# and the deploy; queue them instead.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Cache DuckDB extensions
        # Extension binaries are keyed to the duckdb build, which requirements.txt pins.
        uses: actions/cache@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-ext-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Build, test and publish docs
        env:
          DBT_DUCKDB_PATH: ci.duckdb
          # dim_duid needs the registration list, which the download finds through the
          # GitHub API: anonymous calls from shared runners get rate-limited.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dbt build --target ci --profiles-dir .
          dbt docs generate --target ci --profiles-dir . --empty-catalog
          mkdir -p dashboard/dag
          cp target/index.html dashboard/dag/
          cp target/manifest.json dashboard/dag/
          cp target/catalog.json dashboard/dag/
      - name: Commit dbt docs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/dag/
          git diff --cached --quiet || (git commit -m "Update dbt docs" && git pull --rebase && git push)
      - name: Prepare deploy directory
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p deploy
          cp dashboard/index.html deploy/
          cp dashboard/data.js deploy/
          cp dashboard/views.js deploy/
          cp dashboard/logs.js deploy/
          # perflog.js carries the build stamp the Logs panel shows.
          sed "s/__BUILD__/${GITHUB_SHA::7}/" dashboard/perflog.js > deploy/perflog.js
          cp dashboard/model.js deploy/
          cp -r dashboard/dag deploy/
      - name: Deploy to nemtracker
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          NEMTRACKER_TOKEN: ${{ secrets.NEMTRACKER_TOKEN }}
        run: bash scripts/deploy_pages.sh ./deploy "deploy from ${{ github.repository }}@${{ github.sha }}"
