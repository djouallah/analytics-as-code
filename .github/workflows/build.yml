name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      before:
        description: "The commit the page's compiler is compared with (empty: the parent)"
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Two quick pushes used to run in parallel and race both the "Update dbt docs" commit
# and the deploy; queue them instead.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dax-sql:
    # packages/dax-sql: its own tests, on made-up data in an in-memory DuckDB (no catalog, no
    # capacity). repo.test.js runs every query of the page through the page's compiler.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/dax-sql/package-lock.json
      - run: cd packages/dax-sql && npm ci --no-audit --no-fund && npm test

  page:
    # The page's queries over the files the dashboard has deployed (GitHub Pages; no catalog,
    # no capacity): the SQL page against the DAX page (sql_page.mjs), which the page's deploy
    # waits for; and the DAX page's compiler against the one of the commit before
    # (compiler_ab.mjs: the rows, and the time each takes), a report: a measure changed on
    # purpose changes its rows too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/parity/package-lock.json
      - name: The dashboard's files
        run: |
          bash scripts/parity/fetch_data.sh "$RUNNER_TEMP/data"
          cd scripts/parity && npm ci --no-audit --no-fund
      - name: The SQL page against the DAX page
        run: cd scripts/parity && node sql_page.mjs "$RUNNER_TEMP/data"
      - name: The compiler against the commit before
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          BEFORE: ${{ inputs.before || github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A dispatch, or a push of a new branch (all zeros), has no commit before: the parent.
          if [ -z "${BEFORE//0/}" ]; then
            git fetch -q --deepen=1 origin && BEFORE=$(git rev-parse HEAD~1)
          else
            git fetch -q --depth=1 origin "$BEFORE"
          fi
          git worktree add -q --detach "$RUNNER_TEMP/before" "$BEFORE"
          cd scripts/parity && node compiler_ab.mjs "$RUNNER_TEMP/data" "$RUNNER_TEMP/before" "$RUNNER_TEMP/slower"
      - name: The slower queries' SQL and plans
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: slower-queries
          path: ${{ runner.temp }}/slower
          if-no-files-found: ignore

  test:
    needs: [dax-sql, page]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: The page works out no figure
        # scripts/parity/page_lint.mjs: no arithmetic in the page's script or its queries; a
        # figure is a measure of semantic_model/model.bim. How the page draws (scales, sizes,
        # text) is in dashboard/github/common/frontend/draw.js, which a review reads.
        run: cd scripts/parity && npm ci --no-audit --no-fund && node page_lint.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Cache DuckDB extensions
        # Extension binaries are keyed to the duckdb build, which requirements.txt pins.
        uses: actions/cache@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-ext-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Build, test and publish docs
        env:
          DBT_DUCKDB_PATH: ci.duckdb
          # dim_duid needs the registration list, which the download finds through the
          # GitHub API: anonymous calls from shared runners get rate-limited.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dbt build --target ci --profiles-dir .
          dbt docs generate --target ci --profiles-dir . --empty-catalog
          mkdir -p dashboard/github/common/dag
          cp target/index.html dashboard/github/common/dag/
          # A docs file is copied only when it says something new: dbt stamps each run into
          # the metadata and every node's created_at, so a plain copy changed both files on
          # every push (192 "Update dbt docs" commits in the week to 2026-10-08).
          for f in manifest.json catalog.json; do
            if python - "target/$f" "dashboard/github/common/dag/$f" <<'PY'
          import json, os, sys
          STAMPS = {"created_at", "generated_at", "invocation_id", "invocation_started_at", "user_id"}
          def strip(x):
              if isinstance(x, dict):
                  return {k: strip(v) for k, v in x.items() if k not in STAMPS}
              return [strip(v) for v in x] if isinstance(x, list) else x
          new, old = sys.argv[1:]
          same = os.path.exists(old) and strip(json.load(open(new))) == strip(json.load(open(old)))
          sys.exit(1 if same else 0)
          PY
            then cp "target/$f" dashboard/github/common/dag/; fi
          done
      - name: Commit dbt docs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/github/common/dag/
          git diff --cached --quiet || (git commit -m "Update dbt docs" && git pull --rebase && git push)
      - name: Prepare deploy directory
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          # The DAX page at the root, the SQL page at sql/, stamped (the script says how).
          node scripts/stage_pages.mjs deploy "${GITHUB_SHA::7}"
      - name: Deploy to nemtracker
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          NEMTRACKER_TOKEN: ${{ secrets.NEMTRACKER_TOKEN }}
        run: bash scripts/deploy_pages.sh ./deploy "deploy from ${{ github.repository }}@${{ github.sha }}"
