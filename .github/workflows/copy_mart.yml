name: Copy Mart Tables

# The dashboard's files as a plain copy of the mart tables (scripts/copy_catalog.py), built as
# a workflow artifact. Nothing is deployed: it is what the port of the dashboard to these
# tables is developed and checked against. Import Data still builds the files the site reads.
on:
  workflow_dispatch:
    inputs:
      all_periods:
        description: 'Copy ALL the 5-minute history, not just the latest two half-years'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  id-token: write   # OIDC federated login to Azure (the OneLake token is minted per run)

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ONELAKE_ENDPOINT: https://onelake.table.fabric.microsoft.com/iceberg
      WAREHOUSE_PATH: ${{ vars.WS_ID }}/${{ vars.LH_ID }}
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      ALL_PERIODS: ${{ inputs.all_periods && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Azure federated login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Mint OneLake token
        run: |
          TOKEN=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "ONELAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Install dependencies
        # The two duckdbs of import_data.yml, for the same reason: the catalog is read with the
        # build that writes it, and the .duckdb files are written for the DuckDB-WASM reader.
        run: |
          python -m venv .venv-read
          .venv-read/bin/pip install -q "duckdb==2.0.0.dev2609250715"
          python -m venv .venv-write
          .venv-write/bin/pip install -q "duckdb==1.5.6"

      - name: Copy the mart tables
        run: |
          for group in dim agg today history; do
            .venv-read/bin/python scripts/copy_catalog.py export $group
            .venv-write/bin/python scripts/copy_catalog.py build $group
          done
          ls -l mart_data

      - uses: actions/upload-artifact@v4
        with:
          name: mart-data
          path: mart_data/
          retention-days: 7
          compression-level: 0
