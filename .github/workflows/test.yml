name: Tests

# dbt data-quality tests, decoupled from the data pipeline so a failing
# assertion never blocks downloading (process_data) or publishing (import_data).
# Also probes what the Iceberg REST catalog actually supports.

on:
  schedule:
    # :15, deliberately off process_data's :00/:30 cadence. The compact job shares
    # process_data's concurrency group, so a head-on start at :00 would just make
    # one of them queue; starting mid-slot lets the :00 load finish first.
    - cron: '15 21 * * *'   # ~1h after the daily import (20:00 UTC)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # OneLake Iceberg REST catalog. Each job mints its own short-lived ONELAKE_TOKEN from the
  # OIDC login and resolves WAREHOUSE_PATH itself â€” $GITHUB_ENV does not cross jobs, and the
  # lakehouse id is never pinned in a variable (it changes if the lakehouse is recreated).
  ONELAKE_ENDPOINT: https://onelake.table.fabric.microsoft.com/iceberg
  AZURE_TRANSPORT_OPTION_TYPE: curl
  CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
  LH_NAME: nem

permissions:
  contents: read
  id-token: write   # OIDC federated login to Azure (OneLake tokens are minted per run)

jobs:
  dbt_test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install dbt-duckdb "duckdb==1.6.0.dev365" duckrun
      - name: Azure federated login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Mint OneLake token
        run: |
          TOKEN=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "ONELAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Resolve lakehouse
        run: |
          python - <<'EOF' >> "$GITHUB_ENV"
          import os, duckrun
          ws_id, lh_name = os.environ["WS_ID"], os.environ["LH_NAME"]
          lh_id = duckrun.workspace(ws_id).create_lakehouse(lh_name, schemas=True)
          print(f"WAREHOUSE_PATH={ws_id}/{lh_id}")
          print(f"FILES_PATH=abfss://{ws_id}@onelake.dfs.fabric.microsoft.com/{lh_id}/Files")
          EOF
        env:
          WS_ID: ${{ vars.WS_ID }}
      - name: dbt test
        run: dbt test --target prod --profiles-dir .

  catalog_capabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Same pin as the rest of the pipeline; it's well past 1.5.3, so MERGE is
      # still exercised against the catalog.
      - run: pip install "duckdb==1.6.0.dev365" duckrun
      - name: Azure federated login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Mint OneLake token
        run: |
          TOKEN=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "ONELAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Resolve lakehouse
        run: |
          python - <<'EOF' >> "$GITHUB_ENV"
          import os, duckrun
          ws_id, lh_name = os.environ["WS_ID"], os.environ["LH_NAME"]
          print(f"WAREHOUSE_PATH={ws_id}/{duckrun.workspace(ws_id).create_lakehouse(lh_name, schemas=True)}")
          EOF
        env:
          WS_ID: ${{ vars.WS_ID }}
      - name: Probe catalog capabilities (CREATE / INSERT / DELETE / UPDATE / MERGE / CREATE OR REPLACE / DROP)
        run: python scripts/catalog_capabilities.py

  # Daily Iceberg compaction. It lived in process_data.yml so the workflow-level
  # concurrency group would cover it, but holding that group for the length of a
  # compaction run queued and cancelled the 30-min data loads. Here it gets the same
  # protection from a job-level group, without blocking process_data CI or dbt_test.
  compact:
    runs-on: ubuntu-latest
    # iceberg_rewrite_data_files commits optimistically, so overlapping a load would fail
    # one side.
    concurrency:
      group: process-data
      cancel-in-progress: false
    # Maintenance must never fail the test workflow.
    continue-on-error: true
    # Must exceed COMPACT_BUDGET_MINUTES: the script stops starting new tables at the
    # budget and needs slack to finish the one in flight and print its report.
    #
    # 90/70 now the six-month backfill is done -- that pass took 12 minutes total
    # (5,606 files -> 78), and the daily delta is far smaller. Keep these tight: the
    # job holds the `process-data` concurrency group while it runs, so a stuck run
    # stops data landing for as long as the timeout allows.
    timeout-minutes: 90
    env:
      COMPACT_BUDGET_MINUTES: "70"
      # Without this python block-buffers stdout when it isn't a TTY, so a job that
      # hits the timeout reports nothing at all about what it was doing.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "duckdb==1.6.0.dev365" duckrun
      - name: Azure federated login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Mint OneLake token
        run: |
          TOKEN=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "ONELAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Resolve lakehouse
        run: |
          python - <<'EOF' >> "$GITHUB_ENV"
          import os, duckrun
          ws_id, lh_name = os.environ["WS_ID"], os.environ["LH_NAME"]
          print(f"WAREHOUSE_PATH={ws_id}/{duckrun.workspace(ws_id).create_lakehouse(lh_name, schemas=True)}")
          EOF
        env:
          WS_ID: ${{ vars.WS_ID }}
      - name: Compact Iceberg data files
        run: python scripts/compact_iceberg.py
