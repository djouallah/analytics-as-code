name: Iceberg GC Trial

# Trial of iceberg-go's file-deleting snapshot expiry and orphan cleanup (scripts/iceberg_gc),
# to replace pyiceberg's metadata-only expiry if it holds.
# - dry_run: every table, what each would delete, per folder. Commits and deletes nothing.
# - dummy_expire: a real expiry on a throwaway table, landing.zz_gc_trial (created,
#   compacted, expired, read back, dropped), checking file by file what was deleted.
# Neither touches a table of the pipeline, so neither takes the process-data group.

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry_run, dummy_expire]
        default: dry_run

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ONELAKE_ENDPOINT: https://onelake.table.fabric.microsoft.com/iceberg
  WAREHOUSE_PATH: ${{ vars.WS_ID }}/${{ vars.LH_ID }}
  AZURE_TRANSPORT_OPTION_TYPE: curl
  CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt

permissions:
  contents: read
  id-token: write

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/iceberg_gc/go.mod
          cache-dependency-path: scripts/iceberg_gc/go.sum
      - name: Build
        working-directory: scripts/iceberg_gc
        run: go build -o iceberg_gc .
      - uses: actions/setup-python@v5
        if: inputs.mode == 'dummy_expire'
        with:
          python-version: "3.11"
      - if: inputs.mode == 'dummy_expire'
        run: pip install "duckdb==2.0.0.dev2610011535"
      - name: Azure federated login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Mint OneLake token
        run: |
          TOKEN=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "ONELAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Dry run
        if: inputs.mode == 'dry_run'
        run: |
          TABLES=$(cd scripts && python -c "from iceberg_tables import TABLES; print(' '.join(TABLES))")
          scripts/iceberg_gc/iceberg_gc dry-run $TABLES
      - name: Create the throwaway table
        if: inputs.mode == 'dummy_expire'
        run: python scripts/iceberg_gc/dummy_table.py setup
      - name: Expire it (iceberg-go, deleting files)
        if: inputs.mode == 'dummy_expire'
        run: scripts/iceberg_gc/iceberg_gc expire landing.zz_gc_trial
      - name: Read it back
        if: inputs.mode == 'dummy_expire'
        run: python scripts/iceberg_gc/dummy_table.py check
      - name: Drop it
        if: always() && inputs.mode == 'dummy_expire'
        run: python scripts/iceberg_gc/dummy_table.py drop
