name: Import Data

on:
  schedule:
    - cron: '0 20 * * *'  # 6am AEST (UTC+10) — daily full refresh
  workflow_run:
    workflows: ["Process Data"]
    types: [completed]
  workflow_dispatch:  # manual = daily (full refresh)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write   # OIDC federated login to Azure (OneLake tokens are minted per run)

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      # OneLake Iceberg REST catalog — only the .venv-read (export_*) steps touch it.
      # Workspace/lakehouse ids come from repo VARIABLES; ONELAKE_TOKEN is minted per run.
      ONELAKE_ENDPOINT: https://onelake.table.fabric.microsoft.com/iceberg
      WAREHOUSE_PATH: ${{ vars.WS_ID }}/${{ vars.LH_ID }}
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Azure federated login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Mint OneLake token
        run: |
          TOKEN=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "ONELAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Set mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "is_daily=false" >> $GITHUB_OUTPUT
          else
            echo "is_daily=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: |
          # TWO duckdbs, because this job does two different jobs:
          #
          #   read  -> reads the Iceberg catalog and writes parquet (export_* steps)
          #   write -> reads that parquet and writes .duckdb (build_* steps)
          #
          # The .duckdb files are read client-side by the DuckDB-WASM reader already
          # deployed to the NemTracker dashboard, so their on-disk format must stay
          # at 1.5.1. But 1.5.1 SEGFAULTS reading tables that compaction rewrote with
          # 1.6.0.dev365 -- export_scada_today started dying with exit 139 as soon as
          # fct_scada_today had been compacted. Reading the catalog with the same
          # duckdb that wrote it fixes that.
          #
          # Parquet is the handoff between them, so the dashboard format is untouched.
          python -m venv .venv-read
          .venv-read/bin/pip install -q "duckdb==1.6.0.dev365"
          python -m venv .venv-write
          .venv-write/bin/pip install -q "duckdb==1.5.1"

      # --- Phase 1: Intraday (always) + dims (daily only) â†’ deploy immediately ---
      - name: Export fct_scada_today
        run: .venv-read/bin/python scripts/cache_catalog.py export_scada_today

      - name: Export fct_price_today
        run: .venv-read/bin/python scripts/cache_catalog.py export_price_today

      - name: Build energy_today.duckdb
        run: .venv-write/bin/python scripts/cache_catalog.py build_today

      - name: Export dim_duid
        if: steps.mode.outputs.is_daily == 'true'
        run: .venv-read/bin/python scripts/cache_catalog.py export_dim_duid

      - name: Export dim_calendar
        if: steps.mode.outputs.is_daily == 'true'
        run: .venv-read/bin/python scripts/cache_catalog.py export_dim_calendar

      - name: Build energy_dim.duckdb
        if: steps.mode.outputs.is_daily == 'true'
        run: .venv-write/bin/python scripts/cache_catalog.py build_dim

      - name: Stage data for deploy
        run: |
          mkdir -p deploy_data/data
          cp dashboard/energy_today.duckdb deploy_data/data/
          cp dashboard/metadata.json deploy_data/data/
          if [ "${{ steps.mode.outputs.is_daily }}" = "true" ]; then
            cp dashboard/energy_dim.duckdb deploy_data/data/
          fi
      - name: Deploy to nemtracker (today + dims)
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.NEMTRACKER_TOKEN }}
          external_repository: NemTracker/nemtracker.github.io
          publish_branch: main
          publish_dir: ./deploy_data
          keep_files: true

      # --- Phase 2: Daily full refresh (slow) ---
      - name: Export fct_scada
        if: steps.mode.outputs.is_daily == 'true'
        run: .venv-read/bin/python scripts/cache_catalog.py export_scada

      - name: Export fct_price
        if: steps.mode.outputs.is_daily == 'true'
        run: .venv-read/bin/python scripts/cache_catalog.py export_price

      - name: Build daily databases
        if: steps.mode.outputs.is_daily == 'true'
        run: .venv-write/bin/python scripts/cache_catalog.py build_daily

      - name: Build daily aggregate database
        if: steps.mode.outputs.is_daily == 'true'
        run: .venv-write/bin/python scripts/cache_catalog.py build_daily_agg

      - name: Stage data for deploy (daily)
        if: steps.mode.outputs.is_daily == 'true'
        run: |
          mkdir -p deploy_daily/data
          cp dashboard/energy_data_*.duckdb deploy_daily/data/
          cp dashboard/energy_daily_agg.duckdb deploy_daily/data/
          # NOTE: daily_manifest.json is intentionally NOT deployed here. It is
          # published last (step below) from the period files actually present in
          # the deploy repo, so the manifest can never advertise a file whose
          # .duckdb failed to land in the gh-pages commit (see HISTORY: 2026-07
          # H1->H2 rollover dropped energy_data_2026_h2.duckdb while the manifest
          # still listed it -> dashboard 404).
      - name: Deploy to nemtracker (daily)
        if: steps.mode.outputs.is_daily == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.NEMTRACKER_TOKEN }}
          external_repository: NemTracker/nemtracker.github.io
          publish_branch: main
          publish_dir: ./deploy_daily
          keep_files: true

      # --- Phase 3: Publish manifest LAST, from files actually deployed ---
      - name: Build manifest from deployed files
        if: steps.mode.outputs.is_daily == 'true'
        env:
          GH_TOKEN: ${{ secrets.NEMTRACKER_TOKEN }}
        run: |
          mkdir -p deploy_manifest/data
          # List energy_data_<YYYY>_h<H>.duckdb actually committed in the deploy
          # repo, derive the period tags, and write a manifest of exactly those.
          gh api repos/NemTracker/nemtracker.github.io/contents/data --paginate \
            --jq '.[].name | select(test("^energy_data_[0-9]{4}_h[12]\\.duckdb$")) | capture("^energy_data_(?<tag>[0-9]{4}_h[12])\\.duckdb$").tag' \
            | sort -u > tags.txt
          python - <<'PY'
          import json
          with open("tags.txt") as f:
              tags = [t.strip() for t in f if t.strip()]
          with open("deploy_manifest/data/daily_manifest.json", "w") as f:
              json.dump({"periods": tags}, f)
          print("Manifest:", tags)
          PY
      - name: Deploy manifest to nemtracker
        if: steps.mode.outputs.is_daily == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.NEMTRACKER_TOKEN }}
          external_repository: NemTracker/nemtracker.github.io
          publish_branch: main
          publish_dir: ./deploy_manifest
          keep_files: true

      # Data-quality tests live in their own workflow (.github/workflows/test.yml)
      # so a failing assertion never blocks publishing the dashboard.
