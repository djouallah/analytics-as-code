name: Import Data

on:
  schedule:
    - cron: '0 20 * * *'  # 6am AEST (UTC+10) — daily: dims, the aggregates, the latest two half-years
  workflow_run:
    workflows: ["Process Data"]
    types: [completed]
  workflow_dispatch:  # manual = daily; everything with all_periods
    inputs:
      all_periods:
        description: 'Copy, rebuild and redeploy ALL history, not just the latest two half-years (after a backfill of old data)'
        type: boolean
        default: false
      with_page:
        description: 'Publish the page (as build.yml does) in the same deploy commit as the data: for a change the old page cannot read, so the site switches once'
        type: boolean
        default: false
      publish:
        description: 'Deploy to the site. Off: the files that would be deployed are uploaded as an artifact instead, to check them first'
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The 20:00 schedule and a workflow_run trigger can overlap; both push to the same
# deploy branch, so let one finish before the next starts.
concurrency:
  group: import-data
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write   # OIDC federated login to Azure (OneLake tokens are minted per run)

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      # OneLake Iceberg REST catalog — only the .venv-read (export) steps touch it.
      # Workspace/lakehouse ids come from repo VARIABLES; ONELAKE_TOKEN is minted per run.
      ONELAKE_ENDPOINT: https://onelake.table.fabric.microsoft.com/iceberg
      WAREHOUSE_PATH: ${{ vars.WS_ID }}/${{ vars.LH_ID }}
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      # Daily runs copy and rebuild only the latest two half-years (scripts/cache_catalog.py
      # export_cutoff); the older files stay as deployed. Dispatch with all_periods=true to
      # copy and rebuild everything.
      ALL_PERIODS: ${{ inputs.all_periods && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/workflows/import_data.yml
      - name: Cache DuckDB extensions
        # Two duckdb versions (read/write venvs) keep their extensions in separate
        # version-named subdirectories, so one cache entry serves both.
        uses: actions/cache@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-ext-import-${{ runner.os }}-${{ hashFiles('requirements.txt', '.github/workflows/import_data.yml') }}

      - name: Azure federated login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Mint OneLake token
        run: |
          TOKEN=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "ONELAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Set mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "is_daily=false" >> $GITHUB_OUTPUT
          else
            echo "is_daily=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: |
          # TWO duckdbs, because this job does two different jobs:
          #
          #   read  -> reads the Iceberg catalog and writes parquet (export)
          #   write -> reads that parquet and writes .duckdb (build)
          #
          # The .duckdb files are read client-side by the DuckDB-WASM reader already
          # deployed to the NemTracker dashboard, so their on-disk format must stay
          # on the 1.5 line. But 1.5.1 SEGFAULTED reading tables that compaction rewrote
          # with the 1.6/2.0 dev build. Reading the catalog with the same duckdb that
          # wrote it (requirements.txt's pin) fixes that.
          #
          # Parquet is the handoff between them, so the dashboard format is untouched.
          python -m venv .venv-read
          .venv-read/bin/pip install -q "duckdb==2.0.0.dev2610011535"
          python -m venv .venv-write
          .venv-write/bin/pip install -q "duckdb==1.5.6"

      # The files are a copy of the mart tables, with no rule of their own
      # (scripts/cache_catalog.py). Which file a table goes into is all that is decided here.

      # --- Phase 1: the newest days (always) + the dimensions (daily only) -> deploy at once ---
      - name: Copy the newest days (and the dimensions, daily)
        run: |
          for group in today ${{ steps.mode.outputs.is_daily == 'true' && 'dim' || '' }}; do
            .venv-read/bin/python scripts/cache_catalog.py export $group
            .venv-write/bin/python scripts/cache_catalog.py build $group
          done

      - name: Stage data for deploy
        run: |
          mkdir -p deploy_data/data
          cp mart_data/mart_today.duckdb deploy_data/data/
          if [ "${{ steps.mode.outputs.is_daily }}" = "true" ]; then
            cp mart_data/mart_dim.duckdb deploy_data/data/
          fi
      - name: Deploy to nemtracker (today + dims)
        # With the page, everything goes out in one commit (below).
        if: github.event_name != 'workflow_dispatch' || (inputs.publish && !inputs.with_page)
        env:
          NEMTRACKER_TOKEN: ${{ secrets.NEMTRACKER_TOKEN }}
        run: bash scripts/deploy_pages.sh ./deploy_data "deploy from ${{ github.repository }}@${{ github.sha }}"

      # --- Phase 2: daily only (slow): the aggregates, and the history since the cutoff or all of it ---
      - name: Copy the aggregates and the history
        # Only the half-years since the cutoff; older files stay as deployed.
        if: steps.mode.outputs.is_daily == 'true'
        run: |
          for group in agg history; do
            .venv-read/bin/python scripts/cache_catalog.py export $group
            .venv-write/bin/python scripts/cache_catalog.py build $group
          done
          ls -l mart_data

      - name: Stage data for deploy (daily)
        if: steps.mode.outputs.is_daily == 'true'
        run: |
          mkdir -p deploy_daily/data
          cp mart_data/mart_agg.duckdb mart_data/mart_[0-9]*_h[12].duckdb deploy_daily/data/
          # NOTE: mart_manifest.json is intentionally NOT deployed here. It is
          # published last (step below) from the period files actually present in
          # the deploy repo, so the manifest can never advertise a file whose
          # .duckdb failed to land in the gh-pages commit. Cause of the 2026-07 H1->H2
          # rollover miss: the deploy repo's .gitignore had *.duckdb, and the old deploy
          # action's `git add --all` skipped new ignored files. scripts/deploy_pages.sh
          # adds the published paths with -f.
      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch' && inputs.with_page
        with:
          node-version: "24"
      - name: Stage the page with the data
        # with_page: the page goes out in the same commit as the data, so the site never holds
        # the new page with the old data or the other way round. The same staging as
        # build.yml's "Prepare deploy directory": without the ?v=<build> on every import a
        # browser runs the new page with its cached old modules (2026-10-07).
        if: github.event_name == 'workflow_dispatch' && inputs.with_page
        run: |
          cp deploy_data/data/* deploy_daily/data/
          node scripts/stage_pages.mjs deploy_daily "${GITHUB_SHA::7}"
      - name: Upload instead of deploying
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: deploy
          path: |
            deploy_daily
            deploy_data
          retention-days: 3
      - name: Deploy to nemtracker (daily)
        if: steps.mode.outputs.is_daily == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          NEMTRACKER_TOKEN: ${{ secrets.NEMTRACKER_TOKEN }}
        run: bash scripts/deploy_pages.sh ./deploy_daily "deploy from ${{ github.repository }}@${{ github.sha }}"

      # --- Phase 3: Publish manifest LAST, from files actually deployed ---
      - name: Build manifest from deployed files
        if: steps.mode.outputs.is_daily == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.NEMTRACKER_TOKEN }}
        run: |
          # pipefail: without it a failed `gh api` is hidden by `sort`, the list is empty and
          # the manifest published below tells the page there is no 5-minute history at all.
          set -o pipefail
          mkdir -p deploy_manifest/data
          # List mart_<YYYY>_h<H>.duckdb actually committed in the deploy
          # repo, derive the period tags, and write a manifest of exactly those.
          gh api repos/NemTracker/nemtracker.github.io/contents/data --paginate \
            --jq '.[].name | select(test("^mart_[0-9]{4}_h[12]\\.duckdb$")) | capture("^mart_(?<tag>[0-9]{4}_h[12])\\.duckdb$").tag' \
            | sort -u > tags.txt
          if [ ! -s tags.txt ]; then
            echo "::error::No mart_*_h*.duckdb found in the deploy repo; not publishing an empty manifest"
            exit 1
          fi
          python - <<'PY'
          import json
          with open("tags.txt") as f:
              tags = [t.strip() for t in f if t.strip()]
          with open("deploy_manifest/data/mart_manifest.json", "w") as f:
              json.dump({"periods": tags}, f)
          print("Manifest:", tags)
          PY
      - name: Deploy manifest to nemtracker
        if: steps.mode.outputs.is_daily == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          NEMTRACKER_TOKEN: ${{ secrets.NEMTRACKER_TOKEN }}
        run: bash scripts/deploy_pages.sh ./deploy_manifest "deploy from ${{ github.repository }}@${{ github.sha }}"

      # Data-quality tests live in their own workflow
      # (.github/workflows/table_maintenance.yml) so a failing assertion never blocks
      # publishing the dashboard.
