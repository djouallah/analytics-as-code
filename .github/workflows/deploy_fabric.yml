name: Deploy Fabric

# The whole project in one Fabric workspace: the lakehouse `nem`, the hourly dbt run (the
# notebook `run`, called by the pipeline `run_pipeline` on a schedule), the semantic model and
# its report, and the front end, the Fabric app on VertiPaq (dashboard/fabric_app/vertipaq/),
# whose connector names the model next to it. scripts/deploy_fabric.py does all but the app.
# What runs from GitHub (process_data.yml and the rest, into the workspace of the repository
# variables) is not touched: this installs a second, independent copy.
# One app failing does not stop the other (!cancelled()).
# The workspace has to exist, on a capacity in a region that has Fabric apps (preview).
# On dispatch only: it creates Fabric items, and it runs the pipeline once.
on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: 'Tenant of the workspace'
        required: true
      workspace_id:
        description: 'Workspace to install into'
        required: true
      data:
        description: 'Data: lakehouse, notebook, pipeline (runs it once, schedules it hourly)'
        type: boolean
        default: true
      semantic_model:
        description: 'Semantic model (on the tables a pipeline run made)'
        type: boolean
        default: true
      powerbi_report:
        description: 'Power BI report (on the semantic model)'
        type: boolean
        default: true
      fabric_app_vertipaq:
        description: 'Fabric app on VertiPaq (on the semantic model)'
        type: boolean
        default: true
      fabric_app_wasm:
        description: 'Fabric app on DuckDB-WASM (the .duckdb files of import_onelake.yml; microsoft/rayfin#89)'
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-fabric-${{ inputs.workspace_id }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC federated login; no secret

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WS_ID: ${{ inputs.workspace_id }}
      RAYFIN_WORKSPACE_ID: ${{ inputs.workspace_id }}
      # The Entra app with a federated credential for this repo, per tenant: the catalog's
      # and the Fabric app's (AGENTS.md, Auth).
      CLIENT_ID: ${{ inputs.tenant_id == vars.AZURE_TENANT_ID && vars.AZURE_CLIENT_ID || inputs.tenant_id == vars.LAKE_TENANT_ID && vars.LAKE_CLIENT_ID || '' }}
    steps:
      - name: Identity for the tenant
        run: |
          test -n "$CLIENT_ID" || { echo "::error::no Entra app of this repo in tenant ${{ inputs.tenant_id }}: AZURE_TENANT_ID and LAKE_TENANT_ID are the tenants it has one in"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: inputs.data || inputs.semantic_model || inputs.powerbi_report
        with:
          python-version: "3.11"
      # deploy_model.yml's fabric-cicd, import_onelake.yml's Azure SDK.
      - if: inputs.data || inputs.semantic_model || inputs.powerbi_report
        run: pip install -q "fabric-cicd==1.3.0" "azure-identity==1.26.0" "azure-storage-file-datalake==12.26.0"

      - name: Azure federated login
        uses: azure/login@v2
        with:
          client-id: ${{ env.CLIENT_ID }}
          tenant-id: ${{ inputs.tenant_id }}
          allow-no-subscriptions: true

      - name: Data, semantic model, Power BI report
        if: inputs.data || inputs.semantic_model || inputs.powerbi_report
        run: >-
          python scripts/deploy_fabric.py ${{ inputs.data && 'data' || '' }}
          ${{ inputs.semantic_model && 'model' || '' }} ${{ inputs.powerbi_report && 'report' || '' }}

      # The Fabric apps (Rayfin). Only an item's owner can deploy to it, so CI deploys into
      # items of its own: `vertipaq` and `nemtracker` (the laptop's `wasm` refuses this login).
      - uses: actions/setup-node@v4
        if: inputs.fabric_app_vertipaq || inputs.fabric_app_wasm
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/fabric_app/vertipaq/package-lock.json
            dashboard/fabric_app/wasm/package-lock.json
            dashboard/fabric_app/wasm/rayfin/functions/package-lock.json

      - name: Mint Fabric token
        # RAYFIN_TOKEN: the CLI takes a ready Bearer token instead of an interactive login.
        if: inputs.fabric_app_vertipaq || inputs.fabric_app_wasm
        run: |
          TOKEN=$(az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "RAYFIN_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # --- Fabric app on VertiPaq ---
      - name: "VertiPaq app: install"
        if: inputs.fabric_app_vertipaq
        working-directory: dashboard/fabric_app/vertipaq
        run: npm ci

      - name: "VertiPaq app: declare the connector to the semantic model"
        # rayfin.yml in the repo has no `connectors:` entry: it names the workspace and the
        # model by id, and `connector add` takes literals only. So the entry is written here,
        # as model.bim's ids are at its deploy. The model is found by its name.
        if: inputs.fabric_app_vertipaq
        working-directory: dashboard/fabric_app/vertipaq
        run: |
          set -euo pipefail
          MODEL_ID=$(curl -sf -H "Authorization: Bearer $RAYFIN_TOKEN" \
            "https://api.fabric.microsoft.com/v1/workspaces/$WS_ID/semanticModels" \
            | jq -r '.value[] | select(.displayName == "nem") | .id')
          test -n "$MODEL_ID" || { echo "::error::no semantic model named nem in the workspace"; exit 1; }
          npx rayfin connector add --type fabric-semanticmodel --workspace-id "$WS_ID" \
            --item-id "$MODEL_ID" --name nem --yes
          sed -n '/^connectors:/,$p' rayfin/rayfin.yml | sed -E 's/[0-9a-f]{8}-[0-9a-f-]{27}/<id>/g'

      # --yes: reuse the item on every later run, never ask.
      - name: "VertiPaq app: deploy"
        if: inputs.fabric_app_vertipaq
        working-directory: dashboard/fabric_app/vertipaq
        run: npx rayfin up --item-name vertipaq --workspace-id "$WS_ID" --yes --output json

      # --- Fabric app on DuckDB-WASM ---
      # It reads the .duckdb files import_onelake.yml writes (ONELAKE_FILES_URL), through its
      # function getDataSas. microsoft/rayfin#89: Fabric answers 500 to every function call
      # on an item a service principal owns, so this item deploys but does not work until
      # that is fixed; the app people use is the laptop's `wasm`.
      - name: "WASM app: install"
        if: ${{ !cancelled() && inputs.fabric_app_wasm }}
        working-directory: dashboard/fabric_app/wasm
        run: |
          npm ci
          npm ci --prefix rayfin/functions

      - name: "WASM app: deploy"
        if: ${{ !cancelled() && inputs.fabric_app_wasm }}
        working-directory: dashboard/fabric_app/wasm
        run: npx rayfin up --item-name nemtracker --workspace-id "$WS_ID" --yes --output json

      - name: "WASM app: the function's secret, on a new item"
        # Where getDataSas signs: the Files folder of the lakehouse import_onelake.yml fills.
        # Only an item that lacks it gets it, followed by the function once more: the first
        # deploy went out before the secret existed.
        if: ${{ !cancelled() && inputs.fabric_app_wasm }}
        working-directory: dashboard/fabric_app/wasm
        env:
          ONELAKE_FILES_URL: ${{ vars.ONELAKE_FILES_URL }}
        run: |
          if npx rayfin secret list | grep -q ONELAKE_FILES_URL; then
            echo "The secret is already on the item."
          else
            echo "$ONELAKE_FILES_URL" | npx rayfin secret set ONELAKE_FILES_URL --stdin
            npx rayfin up functions deploy
          fi
