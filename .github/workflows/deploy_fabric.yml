name: Deploy Fabric

# The dashboard's second target. build.yml publishes the page to GitHub Pages; this deploys
# the same page as a Fabric app (fabric/, Rayfin: static hosting, Fabric sign-in, and the
# function that signs the read-only SAS for the data). fabric/build.mjs puts the shared page
# files and the Fabric host's own (fabric/site/) into fabric/dist.
# On dispatch only. Only an item's owner can deploy to it (the page alone included: 403), so
# CI deploys into an item of its own, `nemtracker`, next to the one deployed from the owner's
# laptop (`wasm`). Open: on the CI-owned item getDataSas answers 500; the last step calls it
# and prints the answer.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (rayfin up -n): resolve the target and plan, deploy nothing'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-fabric
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC federated login to the app's tenant; no secret

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            fabric/package-lock.json
            fabric/rayfin/functions/package-lock.json

      # The app's tenant, not the catalog's: the Entra app that import_onelake.yml uploads the
      # data with (LAKE_*). It is a member of the app's workspace.
      - name: Azure federated login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.LAKE_CLIENT_ID }}
          tenant-id: ${{ vars.LAKE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Mint Fabric token
        # RAYFIN_TOKEN: the CLI takes a ready Bearer token instead of an interactive login.
        run: |
          TOKEN=$(az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "RAYFIN_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Install
        working-directory: fabric
        run: |
          npm ci
          npm ci --prefix rayfin/functions

      # The item is CI's own: Rayfin lets only the owner of an app item deploy to it, and the
      # owner is whoever created it. This login created `nemtracker`, so it can deploy to it;
      # an item made from a laptop (`rayfin up` under a user login) refuses it with 403.
      # --yes: reuse that item on every later run, never ask.
      - name: Deploy
        working-directory: fabric
        env:
          RAYFIN_WORKSPACE_ID: ${{ vars.FABRIC_APP_WORKSPACE_ID }}
        # --verbose, kept in deploy.log: it names the User Data Functions item behind the app,
        # which the last step calls.
        run: |
          set -o pipefail
          npx rayfin up --item-name nemtracker --workspace-id "$RAYFIN_WORKSPACE_ID" --yes --verbose --output json ${{ inputs.dry_run && '-n' || '' }} | tee deploy.log

      - name: Set the function's secret, on a new item
        # Where getDataSas signs: the Files folder of the lakehouse import_onelake.yml fills.
        # A public identifier, kept as a repo variable; Rayfin stores it on the item. Only an
        # item that lacks it gets it, followed by the function once more: the first deploy
        # went out before the secret existed, and the app that works was deployed in this
        # order (deploy, secret, deploy).
        if: ${{ !inputs.dry_run }}
        working-directory: fabric
        env:
          ONELAKE_FILES_URL: ${{ vars.ONELAKE_FILES_URL }}
        run: |
          if npx rayfin secret list | grep -q ONELAKE_FILES_URL; then
            echo "The secret is already on the item."
          else
            echo "$ONELAKE_FILES_URL" | npx rayfin secret set ONELAKE_FILES_URL --stdin
            npx rayfin up functions deploy
          fi

      # getDataSas runs as the item's owner, which is this login. What it does first is ask
      # OneLake for a user delegation key; ask for one here, so a deploy says so when OneLake
      # refuses this identity, instead of the app answering 500 to every visitor.
      - name: Check the app's identity can sign a SAS
        if: ${{ !inputs.dry_run }}
        run: |
          TOKEN=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          START=$(date -u -d '-5 min' +%Y-%m-%dT%H:%M:%SZ)
          EXPIRY=$(date -u -d '+30 min' +%Y-%m-%dT%H:%M:%SZ)
          CODE=$(curl -s -o key.xml -w '%{http_code}' -X POST             'https://onelake.blob.fabric.microsoft.com/?restype=service&comp=userdelegationkey'             -H "Authorization: Bearer $TOKEN" -H 'x-ms-version: 2022-11-02' -H 'Content-Type: application/xml'             -d "<?xml version=\"1.0\" encoding=\"utf-8\"?><KeyInfo><Start>$START</Start><Expiry>$EXPIRY</Expiry></KeyInfo>")
          if [ "$CODE" != "200" ]; then
            # An error body carries no key.
            echo "::error::OneLake refused a user delegation key to the app's identity (HTTP $CODE)"
            head -c 800 key.xml; echo
            exit 1
          fi
          rm key.xml
          echo "OneLake issued a user delegation key (HTTP 200)."

      # A visitor's 500 says nothing, and CI cannot sign in to the app as a visitor does. So it
      # calls the function where it can, with the owner's own token: the User Data Functions
      # item behind the app (Fabric's public invoke), and the app's own invoke route. Each
      # answer is printed whole, except a SAS. Never fails the run: it is there to be read.
      - name: Call getDataSas
        if: ${{ !inputs.dry_run }}
        working-directory: fabric
        run: |
          set +e
          FABRIC=https://api.fabric.microsoft.com/v1
          APP=$(jq -r '.deployments[.active].fabricApiUrl' rayfin/.deployments.json)
          WS=$(jq -r '.deployments[.active].fabricWorkspaceId' rayfin/.deployments.json)
          UDF=$(grep -oiE 'userDataFunctions/[0-9a-f-]{36}|UDF item ID: *[0-9a-f-]{36}' deploy.log | grep -oE '[0-9a-f-]{36}' | head -1)
          PBI_TOKEN=$(az account get-access-token --resource https://analysis.windows.net/powerbi/api --query accessToken -o tsv)
          echo "::add-mask::$PBI_TOKEN"
          echo "app: $APP"
          echo "User Data Functions item: ${UDF:-not found in deploy.log}"

          call() {  # label, method, url, token
            echo "::group::$1"
            CODE=$(curl -s -o body.txt -D headers.txt -w '%{http_code}' -X "$2" "$3" \
              -H "Authorization: Bearer $4" -H 'Content-Type: application/json' ${5:+-d "$5"})
            echo "$2 $3"
            echo "HTTP $CODE"
            grep -iE '^(requestid|x-ms-root-activity-id|x-ms-public-api-error-code|x-ms-request-id):' headers.txt
            if grep -q 'sig=' body.txt; then
              echo "The function returned a SAS (not printed)."
            else
              head -c 4000 body.txt; echo
            fi
            echo "::endgroup::"
          }

          echo "Items of the workspace that hold functions:"
          curl -s "$FABRIC/workspaces/$WS/items" -H "Authorization: Bearer $RAYFIN_TOKEN" \
            | jq -r '.value[]? | select(.type | test("Function|AppBackend"; "i")) | "\(.type)\t\(.id)\t\(.displayName)"'

          if [ -n "$UDF" ]; then
            call "functions metadata" GET "$FABRIC/workspaces/$WS/userDataFunctions/$UDF/__private/functions/metadata" "$RAYFIN_TOKEN"
            call "public invoke, Fabric token" POST "$FABRIC/workspaces/$WS/userDataFunctions/$UDF/functions/getDataSas/invoke" "$RAYFIN_TOKEN" '{}'
            call "public invoke, Power BI token" POST "$FABRIC/workspaces/$WS/userDataFunctions/$UDF/functions/getDataSas/invoke" "$PBI_TOKEN" '{}'
          fi
          call "the app's invoke route, Fabric token" POST "${APP%/}/functions/getDataSas/invoke" "$RAYFIN_TOKEN" '{}'
          exit 0
