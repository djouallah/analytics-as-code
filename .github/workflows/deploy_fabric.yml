name: Deploy Fabric

# The dashboard's second target. build.yml publishes the page to GitHub Pages; this deploys
# the same page to the Fabric app (fabric/, Rayfin). fabric/build.mjs puts the shared page
# files and the Fabric host's own (fabric/site/) into fabric/dist.
#
# It deploys the page only, into the item its owner deployed from a laptop. The full deploy
# (`rayfin up`: settings, sign-in, the getDataSas function) is the owner's: Rayfin answers
# anyone else 403, "Only AppBackend artifact owner can perform this operation". And an item
# CI creates for itself is no way round it: with a service principal as owner, the platform
# answers 500 to getDataSas before the function runs (both tried, 2026-10-04).
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-fabric
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC federated login to the app's tenant; no secret

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fabric/package-lock.json

      # The app's tenant, not the catalog's: the Entra app that import_onelake.yml uploads the
      # data with (LAKE_*). It is a member of the app's workspace.
      - name: Azure federated login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.LAKE_CLIENT_ID }}
          tenant-id: ${{ vars.LAKE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Mint Fabric token
        # RAYFIN_TOKEN: the CLI takes a ready Bearer token instead of an interactive login.
        run: |
          TOKEN=$(az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "RAYFIN_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Install
        working-directory: fabric
        run: npm ci

      # FABRIC_APP_DEPLOYMENT is the item's record: the content of fabric/rayfin/.deployments.json
      # as the laptop's `rayfin up` wrote it (ids, URLs and the app's publishable key, all of
      # which the app serves publicly in rayfin.config.json). The CLI finds the item through
      # that file, which Rayfin's own .gitignore keeps out of the repo.
      - name: Deploy the page
        working-directory: fabric
        env:
          FABRIC_APP_DEPLOYMENT: ${{ vars.FABRIC_APP_DEPLOYMENT }}
        run: |
          printf '%s' "$FABRIC_APP_DEPLOYMENT" > rayfin/.deployments.json
          npx rayfin up staticapp deploy --json
