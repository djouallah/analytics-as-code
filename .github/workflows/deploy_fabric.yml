name: Deploy Fabric

# The whole project in one Fabric workspace: the lakehouse `nem`, the hourly dbt run (the
# notebook `run`, called by the pipeline `run_pipeline` on a schedule), the semantic model and
# its report, and the front end, the Fabric app on VertiPaq (dashboard/fabric_app/vertipaq/),
# whose connector names the model next to it. scripts/deploy_fabric.py does all but the app.
# What runs from GitHub (process_data.yml and the rest, into the workspace of the repository
# variables) is not touched: this installs a second, independent copy.
# The workspace has to exist, on a capacity in a region that has Fabric apps (preview).
# On dispatch only: it creates Fabric items, and it runs the pipeline once.
on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: 'Tenant of the workspace'
        required: true
      workspace_id:
        description: 'Workspace to install into'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-fabric-${{ inputs.workspace_id }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC federated login; no secret

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WS_ID: ${{ inputs.workspace_id }}
      RAYFIN_WORKSPACE_ID: ${{ inputs.workspace_id }}
      # The Entra app with a federated credential for this repo, per tenant: the catalog's
      # and the Fabric app's (AGENTS.md, Auth).
      CLIENT_ID: ${{ inputs.tenant_id == vars.AZURE_TENANT_ID && vars.AZURE_CLIENT_ID || inputs.tenant_id == vars.LAKE_TENANT_ID && vars.LAKE_CLIENT_ID || '' }}
    steps:
      - name: Identity for the tenant
        run: |
          test -n "$CLIENT_ID" || { echo "::error::no Entra app of this repo in tenant ${{ inputs.tenant_id }}: AZURE_TENANT_ID and LAKE_TENANT_ID are the tenants it has one in"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # deploy_model.yml's fabric-cicd, import_onelake.yml's Azure SDK.
      - run: pip install -q "fabric-cicd==1.3.0" "azure-identity==1.26.0" "azure-storage-file-datalake==12.26.0"

      - name: Azure federated login
        uses: azure/login@v2
        with:
          client-id: ${{ env.CLIENT_ID }}
          tenant-id: ${{ inputs.tenant_id }}
          allow-no-subscriptions: true

      - name: Lakehouse, notebook, pipeline, model and report
        run: python scripts/deploy_fabric.py

      # The front end.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/fabric_app/vertipaq/package-lock.json

      - name: Mint Fabric token
        # RAYFIN_TOKEN: the CLI takes a ready Bearer token instead of an interactive login.
        run: |
          TOKEN=$(az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "RAYFIN_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Install the app's tools
        working-directory: dashboard/fabric_app/vertipaq
        run: npm ci

      - name: Declare the connector to the semantic model
        # rayfin.yml in the repo has no `connectors:` entry: it names the workspace and the
        # model by id, and `connector add` takes literals only. So the entry is written here,
        # as model.bim's ids are at its deploy. The model is found by its name.
        working-directory: dashboard/fabric_app/vertipaq
        run: |
          set -euo pipefail
          MODEL_ID=$(curl -sf -H "Authorization: Bearer $RAYFIN_TOKEN" \
            "https://api.fabric.microsoft.com/v1/workspaces/$WS_ID/semanticModels" \
            | jq -r '.value[] | select(.displayName == "nem") | .id')
          test -n "$MODEL_ID" || { echo "::error::no semantic model named nem in the workspace"; exit 1; }
          npx rayfin connector add --type fabric-semanticmodel --workspace-id "$WS_ID" \
            --item-id "$MODEL_ID" --name nem --yes
          sed -n '/^connectors:/,$p' rayfin/rayfin.yml | sed -E 's/[0-9a-f]{8}-[0-9a-f-]{27}/<id>/g'

      # --yes: reuse the item on every later run, never ask.
      - name: Deploy the app
        working-directory: dashboard/fabric_app/vertipaq
        run: npx rayfin up --item-name vertipaq --workspace-id "$WS_ID" --yes --output json
