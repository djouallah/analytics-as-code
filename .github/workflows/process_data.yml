name: Process Data

# Every hour. There is no daily/intraday split any more: the staging model does every
# feed (daily archive, intraday SCADA, intraday DispatchIS, rooftop, the monthly archives)
# plus the DUID reference on every pass, and self-gates the slow parts on data rather than on
# a schedule —
#   * a DUID reference file is downloaded when its last download is 24h old
#   * the backfills (GitHub historical listing, monthly and weekly archives) only run when
#     AEMO returned fewer than download_limit new daily files
# so the cadence is a choice of freshness, not of cost.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      download_limit:
        description: 'Files fetched per feed per run (blank = 200). Raise it to burst the backfill.'
        required: false
      process_limit:
        description: 'Files turned into fact rows per feed per run (blank = 300)'
        required: false
      rebuild:
        description: 'Table to DROP before the run so it is rebuilt from the archive (e.g. fct_scada). Blank = none. Refills at process_limit files per run.'
        required: false
      debug:
        description: 'Print every statement dbt runs, with its timing: where a model spends its time'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: process-data
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC federated login to Azure (OneLake tokens are minted per run)

jobs:
  process_data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # OneLake Iceberg REST catalog. The workspace and lakehouse are infrastructure — created
      # once by hand — so CI is simply told which ones to use via repo VARIABLES (public ids,
      # not secrets). Nothing here provisions anything. ONELAKE_TOKEN is minted per run.
      ONELAKE_ENDPOINT: https://onelake.table.fabric.microsoft.com/iceberg
      WAREHOUSE_PATH: ${{ vars.WS_ID }}/${{ vars.LH_ID }}
      FILES_PATH: abfss://${{ vars.WS_ID }}@onelake.dfs.fabric.microsoft.com/${{ vars.LH_ID }}/Files
      # The azure extension's default transport fails the OneLake TLS handshake on the
      # runners; curl needs the runner's CA bundle.
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      # Authenticated GitHub API calls for the staging model's backfill listing —
      # anonymous calls share the runner IP's 60 req/h quota and get rate-limited.
      GITHUB_TOKEN: ${{ github.token }}
      # The same cap for every feed, applied to each on its own (daily, scada_today,
      # price_today, rooftop, the monthly archives), and a CAP rather than a workload: an hourly slot only publishes ~12 intraday files per
      # feed and at most one daily file, so in steady state this never binds — it only sets
      # how fast the historical backfill drains.
      #
      # 200 is sized to the cadence, not to appetite: staging runs at roughly 5s/file
      # (60 files took ~5min), so ~200 keeps a run near ~17min, well inside the hourly slot.
      # Going much higher makes a run outlast its slot and the next tick queues behind it
      # (concurrency group `process-data`, cancel-in-progress: false), which stalls the
      # intraday feeds rather than speeding anything up. Burst higher via dispatch when you
      # want a backfill push and can accept the queueing.
      download_limit: ${{ inputs.download_limit || '200' }}
      # Files turned into fact rows per feed per run (read by the fact models' pre-hooks).
      process_limit: ${{ inputs.process_limit || '300' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Cache DuckDB extensions
        # Extension binaries are keyed to the duckdb build, which requirements.txt pins.
        uses: actions/cache@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-ext-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Azure federated login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Mint OneLake token
        run: |
          TOKEN=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "ONELAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Drop table for rebuild
        # Dispatch-only. `rebuild=<table>` drops it so the dbt run below recreates it from
        # the archive with a plain CTAS — see scripts/rebuild_table.py for why this and not
        # --full-refresh. The step fails the job rather than fall through to a normal load.
        if: github.event_name == 'workflow_dispatch' && inputs.rebuild != ''
        env:
          REBUILD_TABLE: ${{ inputs.rebuild }}
        run: python scripts/rebuild_table.py
      - name: Process data
        # The download, the landing facts and the two dimensions the mart tables are built
        # from. The mart tables are the next step.
        run: dbt ${{ inputs.debug && '--debug' || '' }} run --target prod --profiles-dir . --exclude tag:powerbi
      - name: Build the Power BI tables
        # The mart tables (tag powerbi), built from the facts above: what the semantic model
        # reads, and so Power BI and the dashboard. A failure fails the job: Import Data only
        # runs after a green Process Data, so the dashboard keeps the files it has and the
        # red run says why.
        timeout-minutes: 45
        run: dbt ${{ inputs.debug && '--debug' || '' }} run --target prod --profiles-dir . --select tag:powerbi
