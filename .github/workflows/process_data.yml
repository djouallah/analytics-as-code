name: Process Data

on:
  schedule:
    - cron: '*/30 * * * *'   # intraday — live AEMO listing only
    - cron: '0 19 * * *'     # daily (5am AEST) — GitHub backfill + DUID/dim_duid refresh
  workflow_dispatch:
    inputs:
      daily_refresh:
        description: 'Run the daily pass (GitHub backfill + DUID refresh)'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: process-data
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC federated login to Azure (OneLake tokens are minted per run)

jobs:
  process_data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # OneLake Iceberg REST catalog — ids come from repo VARIABLES (public, not secrets);
      # ONELAKE_TOKEN is minted below, per run, from the OIDC login.
      ONELAKE_ENDPOINT: https://onelake.table.fabric.microsoft.com/iceberg
      WAREHOUSE_PATH: ${{ vars.WS_ID }}/${{ vars.LH_ID }}
      # The azure extension's default transport fails the OneLake TLS handshake on the
      # runners; curl needs the runner's CA bundle.
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      download_limit: "2"
      intraday_download_limit: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install dbt-duckdb "duckdb==1.6.0.dev365"
      - name: Azure federated login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Mint OneLake token
        run: |
          TOKEN=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "ONELAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Determine daily-refresh mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "0 19 * * *" ] || [ "${{ github.event.inputs.daily_refresh }}" = "true" ]; then
            echo "daily_refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "daily_refresh=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Heal orphaned daily log entries (daily pass only)
        if: steps.mode.outputs.daily_refresh == 'true'
        run: dbt run-operation heal_orphaned_daily_files --target prod --profiles-dir .
      - name: Process data
        env:
          daily_refresh: ${{ steps.mode.outputs.daily_refresh }}
        run: dbt run --target prod --profiles-dir .
      - name: Confirm processed log entries
        run: dbt run-operation confirm_log_entries --target prod --profiles-dir .
