name: Process Data

# Every 30 minutes. There is no daily/intraday split any more: the staging model does all
# three feeds (daily archive, intraday SCADA, intraday price) plus the DUID reference on
# every pass, and self-gates the slow parts on data rather than on a schedule —
#   * the DUID download is skipped while the last one is < 24h old
#   * the GitHub historical backfill listing only runs when AEMO returned fewer than
#     download_limit new files
# so a 30-minute cadence costs nothing extra over an hourly one.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: process-data
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC federated login to Azure (OneLake tokens are minted per run)

jobs:
  process_data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # OneLake Iceberg REST catalog. WAREHOUSE_PATH and FILES_PATH are resolved at runtime
      # by the "Resolve lakehouse" step below (the lakehouse id is never pinned in a
      # variable — it changes if the lakehouse is recreated). ONELAKE_TOKEN is minted per
      # run from the OIDC login.
      ONELAKE_ENDPOINT: https://onelake.table.fabric.microsoft.com/iceberg
      # The azure extension's default transport fails the OneLake TLS handshake on the
      # runners; curl needs the runner's CA bundle.
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      # Authenticated GitHub API calls for the staging model's backfill listing —
      # anonymous calls share the runner IP's 60 req/h quota and get rate-limited.
      GITHUB_TOKEN: ${{ github.token }}
      LH_NAME: nem
      # A single shared cap across all three feeds (daily, scada_today, price_today), and a
      # CAP rather than a workload: a 30-minute slot only publishes ~6 intraday files per
      # feed and at most one daily file, so this only binds during backfill.
      download_limit: "60"
      # Files turned into fact rows per feed per run (read by the fact models' pre-hooks).
      process_limit: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install dbt-duckdb "duckdb==1.6.0.dev365" duckrun
      - name: Azure federated login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Mint OneLake token
        run: |
          TOKEN=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "ONELAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Resolve lakehouse
        # Idempotent create-if-missing (schema-enabled — the models write to landing/mart),
        # then export the paths the dbt run reads. duckrun self-acquires its own Fabric token
        # from the Azure CLI login above.
        #
        # Creating a lakehouse also provisions a SQL analytics endpoint, and that step can be
        # refused for reasons unrelated to this repo ("try again later"). Steady state never
        # takes this path — the lakehouse already exists and is found by name — so the retry
        # only matters the first time, or after someone deletes it.
        run: |
          python - <<'EOF' >> "$GITHUB_ENV"
          import os, sys, time, duckrun
          ws_id, lh_name = os.environ["WS_ID"], os.environ["LH_NAME"]
          ws = duckrun.workspace(ws_id)
          for attempt in range(4):
              try:
                  lh_id = ws.create_lakehouse(lh_name, schemas=True)
                  break
              except Exception as e:
                  if attempt == 3:
                      raise
                  print(f"::warning::lakehouse create failed ({str(e).splitlines()[0][:120]}) "
                        f"— retrying in 30s", file=sys.stderr)
                  time.sleep(30)
          print(f"WAREHOUSE_PATH={ws_id}/{lh_id}")
          print(f"FILES_PATH=abfss://{ws_id}@onelake.dfs.fabric.microsoft.com/{lh_id}/Files")
          EOF
        env:
          WS_ID: ${{ vars.WS_ID }}
      - name: Process data
        run: dbt run --target prod --profiles-dir .
