name: Process Data

on:
  schedule:
    - cron: '*/30 * * * *'   # intraday — live AEMO listing only
    - cron: '0 19 * * *'     # daily (5am AEST) — GitHub backfill + DUID/dim_duid refresh
  workflow_dispatch:
    inputs:
      daily_refresh:
        description: 'Run the daily pass (GitHub backfill + DUID refresh)'
        type: boolean
        default: false
      compact_only:
        description: 'Skip the data load and only run Iceberg compaction'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: process-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process_data:
    if: github.event.inputs.compact_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      daily_refresh: ${{ steps.mode.outputs.daily_refresh }}
    env:
      ICEBERG_REST_ENDPOINT: ${{ secrets.ICEBERG_REST_ENDPOINT }}
      ICEBERG_TOKEN: ${{ secrets.ICEBERG_TOKEN }}
      ICEBERG_WAREHOUSE: ${{ secrets.ICEBERG_WAREHOUSE }}
      download_limit: "2"
      intraday_download_limit: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install dbt-duckdb "duckdb==1.6.0.dev365"
      - name: Determine daily-refresh mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "0 19 * * *" ] || [ "${{ github.event.inputs.daily_refresh }}" = "true" ]; then
            echo "daily_refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "daily_refresh=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Heal orphaned daily log entries (daily pass only)
        if: steps.mode.outputs.daily_refresh == 'true'
        run: dbt run-operation heal_orphaned_daily_files --target prod --profiles-dir .
      - name: Process data
        env:
          daily_refresh: ${{ steps.mode.outputs.daily_refresh }}
        run: dbt run --target prod --profiles-dir .
      - name: Confirm processed log entries
        run: dbt run-operation confirm_log_entries --target prod --profiles-dir .

  # Daily Iceberg compaction. Lives in this workflow (rather than its own) so the
  # workflow-level `process-data` concurrency group covers it: iceberg_rewrite_data_files
  # commits optimistically and the delete+insert models remove data files, so an overlap
  # with an intraday run would fail one side. Holding the group blocks the :00/:30 runs
  # for the duration, which is fine -- they're idempotent and re-run every 30 min.
  compact:
    needs: process_data
    # `always()` is needed so a compact_only dispatch still runs when process_data
    # is skipped; the explicit result checks put back the success gate it removes,
    # because compaction must not run on top of a failed or cancelled load.
    if: >-
      always()
      && needs.process_data.result != 'failure'
      && needs.process_data.result != 'cancelled'
      && (needs.process_data.outputs.daily_refresh == 'true'
          || github.event.inputs.compact_only == 'true')
    # Maintenance must never fail "Process Data" -- import_data.yml's workflow_run
    # trigger gates on this workflow's conclusion being success.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ICEBERG_REST_ENDPOINT: ${{ secrets.ICEBERG_REST_ENDPOINT }}
      ICEBERG_TOKEN: ${{ secrets.ICEBERG_TOKEN }}
      ICEBERG_WAREHOUSE: ${{ secrets.ICEBERG_WAREHOUSE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "duckdb==1.6.0.dev365"
      - name: Compact Iceberg data files
        run: python scripts/compact_iceberg.py
