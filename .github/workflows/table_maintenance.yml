name: Table Maintenance

# Daily upkeep of the Iceberg tables — compaction then snapshot expiry — plus the dbt
# data-quality tests, which are here for the same reason: both are decoupled from the
# data pipeline so neither a failing assertion nor a slow rewrite ever blocks
# downloading (process_data) or publishing (import_data).

on:
  schedule:
    # :15, deliberately off process_data's :00/:30 cadence. The maintenance job shares
    # process_data's concurrency group, so a head-on start at :00 would just make
    # one of them queue; starting mid-slot lets the :00 load finish first.
    - cron: '15 21 * * *'   # ~1h after the daily import (20:00 UTC)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # OneLake Iceberg REST catalog — workspace/lakehouse ids come from repo VARIABLES (public
  # ids, not secrets). Each job mints its own short-lived ONELAKE_TOKEN from the OIDC login.
  ONELAKE_ENDPOINT: https://onelake.table.fabric.microsoft.com/iceberg
  WAREHOUSE_PATH: ${{ vars.WS_ID }}/${{ vars.LH_ID }}
  FILES_PATH: abfss://${{ vars.WS_ID }}@onelake.dfs.fabric.microsoft.com/${{ vars.LH_ID }}/Files
  AZURE_TRANSPORT_OPTION_TYPE: curl
  CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt

permissions:
  contents: read
  id-token: write   # OIDC federated login to Azure (OneLake tokens are minted per run)

jobs:
  dbt_test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Cache DuckDB extensions
        # Extension binaries sit in a folder per duckdb version: a newer duckdb installs its own.
        uses: actions/cache@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-ext-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Azure federated login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Mint OneLake token
        run: |
          TOKEN=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "ONELAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: dbt test
        run: dbt test --target prod --project-dir dbt --profiles-dir dbt

  # Daily Iceberg maintenance, one table at a time, on apache/iceberg-go (scripts/maintain):
  # compaction, dangling delete files, snapshot expiry, orphan files. It lived in
  # process_data.yml so the workflow-level concurrency group would cover it, but holding that
  # group for the length of a compaction run queued and cancelled the data loads. Here it gets
  # the same protection from a job-level group, without blocking process_data CI or dbt_test.
  compact_and_expire:
    runs-on: ubuntu-latest
    # A rewrite commits optimistically, so overlapping a load would fail one side.
    concurrency:
      group: process-data
      cancel-in-progress: false
    # Maintenance must never fail this workflow — a red dbt_test is a finding, a red
    # maintenance step is just "the tables stay as they are until tomorrow".
    continue-on-error: true
    # Must exceed COMPACT_BUDGET_MINUTES: the tool stops starting new tables at the budget
    # and needs slack to finish the one in flight. Keep it tight: the job holds the
    # `process-data` concurrency group while it runs, so a stuck run stops data landing
    # for as long as the timeout allows.
    timeout-minutes: 90
    env:
      COMPACT_BUDGET_MINUTES: "70"
      EXPIRE_OLDER_THAN_DAYS: "1"
      ORPHAN_OLDER_THAN_DAYS: "3"
      WS_ID: ${{ vars.WS_ID }}
      LH_ID: ${{ vars.LH_ID }}
      # The tool mints its own tokens from the GitHub OIDC endpoint, fresh for each one
      # (an az login's token cannot be refreshed past its first).
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: scripts/maintain/go.mod
          cache-dependency-path: scripts/maintain/go.mod
      - name: Build the maintenance job (iceberg-go)
        working-directory: scripts/maintain
        run: go mod tidy && go build -o "$RUNNER_TEMP/maintain" .
      - name: Maintain the tables
        run: '"$RUNNER_TEMP/maintain" "$RUNNER_TEMP/maintenance.json"'
      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance
          path: ${{ runner.temp }}/maintenance.json
          if-no-files-found: ignore
