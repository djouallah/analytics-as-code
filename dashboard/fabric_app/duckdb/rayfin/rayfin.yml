id: duckdb
name: duckdb
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://full-finch-a4ecfed702-australiasoutheast.webapp.fabricapps.net
  data:
    enabled: false
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: node ../common/build.mjs github
    indexDocument: index.html
    assetAccess: public
  storage:
    enabled: false
  functions:
    enabled: true
    buildCommand: npm run build
    auth:
      type: application
secrets:
  - name: FILES_URL
    description: The folder the app reads its .duckdb files from, https://onelake.dfs.fabric.microsoft.com/<workspace id>/<lakehouse id>/Files/duckdb (written by import_data.yml, scripts/upload_onelake.py)
